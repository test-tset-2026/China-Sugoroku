<style>
/* 中国大陸すごろく
   Layout: 大きな地図（#stage）をカメラで動かし、そのまわりに操作パネル（#hud）を重ねる。
   メッセージやダイアログは #overlay に画面の実寸で出す。小さい画面では body.compact */
:root {
  --ink: #1b2440;
  --navy: #1b2a50;
  --navy-hi: #24479e;
  --navy-lo: #152e72;
  --gold: #f2b632;
  --gold-dk: #a8730a;
  --cream: #fffdf4;
  --red: #e0302f;
  --cn-red: #c81e1e;
  --green: #22a04a;
  --badge: #1a5fc8;
  --season: #ef6fa2;
  --f-pop: 'Mochiy Pop One', 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
  --f-ui: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  color-scheme: light;
}
body[data-season="n"] { --season: #21a0d8; }
body[data-season="a"] { --season: #e0782a; }
body[data-season="f"] { --season: #5b84c8; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #4aa3e0; color: var(--ink); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* 地面：画面に見えている範囲だけの #ground を rotateX でたおし、その中で #stage（背景・線路・マス）を2Dで動かす。
   変形の値は camera.js が毎フレーム書きこむ */
#viewport { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#8fd0f2, #cdeaf8 38%, #d6d0a2 62%, #b9cf8c); }
#ground { position: absolute; left: 0; top: 0; width: 100px; height: 100px; overflow: hidden; transform-origin: 0 0; cursor: grab; }
#stage { position: absolute; left: 0; top: 0; width: 3520px; height: 2740px; transform-origin: 0 0; user-select: none; -webkit-user-select: none; touch-action: none; will-change: transform; }
#viewport.dragging #ground { cursor: grabbing; }
#bg, #season, #map { position: absolute; left: 0; top: 0; width: 3520px; height: 2740px; }
#season { pointer-events: none; }

/* ---------- マップ ---------- */
.nb-label { font: 900 30px var(--f-ui); fill: #5a4a2a; stroke: #fff6d8; stroke-width: 6px; paint-order: stroke; stroke-linejoin: round; letter-spacing: 3px; opacity: .85; pointer-events: none; }
.sea-label { font: 900 36px var(--f-ui); fill: #fff; stroke: #2a6fb0; stroke-width: 6px; paint-order: stroke; stroke-linejoin: round; letter-spacing: 8px; opacity: .9; pointer-events: none; }
.rail-base path { fill: none; stroke: #1a1d24; stroke-width: 10; stroke-linecap: round; }
.rail-white path { fill: none; stroke: #fff; stroke-width: 6.5; stroke-linecap: round; }
.rail-dash path { fill: none; stroke: #1a1d24; stroke-width: 6.5; stroke-dasharray: 7 7; }
.sea-base path { fill: none; stroke: #0f4c8a; stroke-width: 8; stroke-linecap: round; }
.sea-dash path { fill: none; stroke: #bfe6ff; stroke-width: 4.5; stroke-dasharray: 10 8; stroke-linecap: round; }
.sq-out { fill: #1a1d24; }
.sq-in { stroke: #fff; stroke-width: 2; }
.sq-in-panda { stroke: #1b1b1f; }
.sq-icon { stroke: #fff; stroke-width: 2.4; stroke-linecap: round; fill: none; }
.sq-txt { font: 900 11.5px var(--f-ui); fill: #fff; text-anchor: middle; }
.sq-kanji { font-size: 10.5px; }
.mk-txt { font: 900 8px var(--f-ui); fill: #fff; text-anchor: middle; }
#lyr-season use { pointer-events: none; }
.hub-out { fill: #5a3a00; }
.hub-in { stroke: #fff; stroke-width: 2; }
.hub-tag { fill: var(--cn-red); stroke: #fff; stroke-width: 2; }
.hub-name { font: 900 13px var(--f-ui); fill: #fff; }
.st { cursor: pointer; }
.st-out { fill: #1a1d24; }
.st-in { stroke: #fff; stroke-width: 2.2; }
.st.flash .st-in { animation: st-flash .5s 4 alternate; }
@keyframes st-flash { to { fill: #ffe14d; } }
.dest-ring { fill: rgba(255, 80, 60, .28); stroke: #ff3b2f; stroke-width: 4; }
.decor { pointer-events: none; }
.owner-dot { stroke: #fff; stroke-width: 1.6; }
.mono-ring { fill: none; stroke-width: 4; }
.mono-crown { font: 900 11.5px var(--f-ui); fill: #fff; }
.dest-flag .bob { animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.dest-flag text { font: 900 14px var(--f-ui); fill: #fff; }

.hl-ring { fill: rgba(255, 228, 77, .25); stroke: #ffd400; stroke-width: 4; cursor: pointer; animation: hl 0.9s ease-in-out infinite alternate; }
.hl-ring.goal { stroke: #ff3b2f; fill: rgba(255, 90, 70, .25); }
.hl-ring:hover { fill: rgba(255, 228, 77, .55); }
.hl-ring.sel { stroke: #ff6a00; stroke-width: 6; fill: rgba(255, 140, 0, .35); animation: none; }
@keyframes hl { from { stroke-opacity: 1; } to { stroke-opacity: .35; } }
.hl-path { fill: none; stroke: #ff8a00; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 12; animation: march .6s linear infinite; pointer-events: none; }
@keyframes march { to { stroke-dashoffset: -14; } }


/* ---------- タイトルロゴ ---------- */
.t-big text { font-family: var(--f-pop); font-size: 118px; letter-spacing: 6px; }
.t-sub2 text { font-family: var(--f-pop); font-size: 74px; }
.t-o1 { fill: #3a0505; stroke: #3a0505; stroke-width: 18px; stroke-linejoin: round; }
.t-o2 { fill: #fff; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; }
.t-big .t-o2 { fill: #c81e1e; stroke: #c81e1e; }
.t-f { stroke: rgba(0, 0, 0, .25); stroke-width: 1px; }
.t-rib { font: 900 21px var(--f-ui); fill: #fff; letter-spacing: .5px; }
.t-num { font: 400 28px var(--f-pop); fill: #ffe14d; }

/* ================= 操作パネル（HUD） ================= */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#hud > * { pointer-events: auto; }
#hud-top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(env(safe-area-inset-right, 0px) + 12px) 6px calc(env(safe-area-inset-left, 0px) + 10px);
  background: linear-gradient(rgba(255, 253, 244, .98), rgba(255, 249, 232, .96)); border-bottom: 4px solid var(--cn-red); box-shadow: 0 3px 10px rgba(0, 0, 0, .2); }
#h-logo { flex: 0 0 auto; width: 132px; height: 76px; margin: -4px 0; }
#h-logo svg { width: 132px; height: 76px; display: block; }
.hb { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #cfd9e6; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
.hb span { display: block; width: 20px; height: 3px; border-radius: 2px; background: var(--navy); }
#h-menu { display: none; }
.hb-text { width: auto; padding: 0 14px; font: 900 15px var(--f-ui); color: var(--navy); }
.hud-info { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.hi-cal { display: flex; align-items: center; gap: 8px; font: 900 20px var(--f-ui); color: var(--navy); white-space: nowrap; }
.season-chip { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; font: 400 18px var(--f-pop); background: var(--season); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--season); }
.left-chip { font: 800 12.5px var(--f-ui); color: #fff; background: var(--navy); padding: 2px 9px; border-radius: 10px; }
.hi-dest { display: flex; align-items: center; gap: 7px; font: 900 17px var(--f-ui); color: var(--ink); min-width: 0; white-space: nowrap; }
.hi-dest #h-dest { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hi-dest small { font-size: 13px; color: #4a5470; margin-left: 4px; }
.st-tag { background: var(--red); color: #fff; font-size: 13px; padding: 2px 7px; border-radius: 6px; flex: 0 0 auto; }
.hi-turn { flex: 1 1 auto; text-align: right; font: 900 18px var(--f-ui); color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hi-turn small { font-size: 14px; color: #4a5470; }

#hud-menu { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 10px); top: calc(var(--hud-t, 80px) + 10px); width: 158px; padding: 6px; background: rgba(255, 255, 255, .97);
  border-radius: 16px; border: 3px solid #cfd9e6; box-shadow: 0 4px 0 #98abc6, 0 8px 18px rgba(20, 40, 80, .25); display: flex; flex-direction: column; }
#hud-menu button { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px; border: 0; border-bottom: 2px solid #e5ebf2; background: transparent; font: 900 16px/1 var(--f-ui); color: var(--navy); cursor: pointer; text-align: left; border-radius: 10px; white-space: nowrap; }
#hud-menu button:last-child { border-bottom: 0; }
#hud-menu button:hover { background: #eaf3ff; }
#hud-menu .ic svg { width: 34px; height: 34px; display: block; }

#hud-mini { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(var(--hud-t, 80px) + 10px); width: 244px; background: linear-gradient(#a8141c, #6e0a10); border-radius: 14px; border: 3px solid #f6c431; box-shadow: 0 0 0 2px #4a0606, 0 6px 14px rgba(0, 0, 0, .3); padding: 6px 9px 9px; color: #fff; cursor: pointer; }
#hud-mini h3 { margin: 0 0 4px; font: 900 15px var(--f-ui); display: flex; align-items: baseline; gap: 8px; }
#hud-mini h3 small { font-size: 11px; opacity: .8; }
.mm-map { position: relative; width: 220px; height: 172px; }
#mm-canvas, #mm-over { position: absolute; left: 0; top: 0; width: 220px; height: 172px; }
#mm-view { fill: rgba(255, 255, 255, .2); stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; }
.mm-zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.mm-zoom button { width: 30px; height: 30px; border-radius: 9px; border: 2px solid #fff; background: rgba(0, 0, 0, .35); color: #fff; font: 900 18px/1 var(--f-ui); cursor: pointer; }

#mascot { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 8px); bottom: calc(var(--hud-b, 100px) + 6px); width: 150px; height: 190px; pointer-events: none !important; }
#mascot .bubble { position: absolute; left: 0; top: 0; width: 146px; min-height: 54px; background: #fff; border: 3px solid var(--cn-red); border-radius: 18px; padding: 6px; font: 900 14.5px/1.3 var(--f-ui); color: var(--cn-red); text-align: center; transform: rotate(-4deg); box-shadow: 0 3px 0 rgba(0, 0, 0, .15); display: grid; place-items: center; }
#mascot .bubble::after { content: ''; position: absolute; right: 44px; bottom: -14px; border: 9px solid transparent; border-top: 12px solid var(--cn-red); }
#mascot .bubble::before { content: ''; position: absolute; right: 47px; bottom: -8px; border: 6px solid transparent; border-top: 9px solid #fff; z-index: 1; }
#mascot .mascot-body { position: absolute; right: 4px; bottom: 0; width: 96px; }
#mascot .mascot-body svg { display: block; animation: sway 3s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .25)); }
@keyframes sway { 50% { transform: rotate(-3deg) translateY(-2px); } }

#hud-bottom { position: absolute; left: 0; right: 0; bottom: 0;
  padding: 6px calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 7px) calc(env(safe-area-inset-left, 0px) + 10px);
  background: linear-gradient(rgba(255, 249, 232, .96), rgba(255, 253, 244, .98)); border-top: 4px solid var(--cn-red); box-shadow: 0 -3px 10px rgba(0, 0, 0, .2); }
.hud-players { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 7px; max-width: 1560px; margin: 0 auto; }
.hp { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 4px 6px 4px 4px; border-radius: 12px; border: 2.5px solid var(--pc); background: #fff; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.hp.turn { background: linear-gradient(#fffbe0, #fff2b8); box-shadow: 0 0 0 3px #ffd400, 0 0 16px 4px rgba(255, 210, 40, .6); transform: translateY(-3px); }
.hp-face { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: radial-gradient(#fff, #e9f2ff); border: 2.5px solid var(--pc-d); display: grid; place-items: center; }
.hp-face svg { width: 46px; height: 46px; }
.hp-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; flex: 1 1 auto; }
.hp-name { font: 900 13px var(--f-ui); color: var(--pc-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-money { font: 900 17px var(--f-ui); color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-money.neg { color: var(--red); }
.hp-sub { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.hp-who { font: 800 11px var(--f-ui); color: #fff; background: rgba(0, 0, 0, .4); border-radius: 6px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.hp.me .hp-who { background: var(--pc); }
.hp-tags { font: 800 11px var(--f-ui); color: #5a6480; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-bear { position: absolute; right: -6px; top: -14px; width: 26px; height: 26px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .4)); }
.hp-bear img, .hp-bear svg { width: 26px; height: 26px; display: block; }

.hud-actions { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 12px); display: flex; gap: 10px; align-items: flex-end; }
.hroll, .hcard { display: flex; align-items: center; gap: 8px; border-radius: 20px; cursor: pointer; font-family: var(--f-ui); white-space: nowrap; }
.hroll { font: 900 22px var(--f-ui); padding: 12px 24px 12px 14px; color: #fff; background: linear-gradient(#f4524a, #c81e1e); border: 3px solid #fff; box-shadow: 0 0 0 2px #8e1010, 0 8px 16px rgba(0, 0, 0, .35); animation: hroll 1.2s ease-in-out infinite; }
@keyframes hroll { 50% { transform: translateY(-4px); } }
.hcard { font: 900 17px var(--f-ui); padding: 10px 16px 10px 10px; color: var(--navy); background: #fff; border: 3px solid #22a04a; box-shadow: 0 6px 12px rgba(0, 0, 0, .25); }
.hroll .ic svg { width: 36px; height: 36px; display: block; }
.hcard .ic svg { width: 28px; height: 28px; display: block; }
.hud-sheet { position: absolute; inset: 0; background: rgba(10, 25, 60, .35); z-index: 5; }
.sheet-box { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 8px); top: calc(var(--hud-t, 56px) + 6px); width: 230px; background: #fff; border-radius: 16px; border: 3px solid #cfd9e6; box-shadow: 0 10px 24px rgba(0, 0, 0, .3); padding: 6px; display: flex; flex-direction: column; }
.sheet-box button { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 10px; border: 0; border-bottom: 2px solid #eef2f7; background: transparent; font: 900 17px var(--f-ui); color: var(--navy); text-align: left; cursor: pointer; border-radius: 10px; }
.sheet-box button:last-child { border-bottom: 0; }
.sheet-box .ic svg { width: 32px; height: 32px; display: block; }
#hud-menu button:focus-visible, .btn:focus-visible, .chip:focus-visible, .hroll:focus-visible { outline: 4px solid #ffb400; outline-offset: 2px; }

/* ================= メッセージ・サイコロ・バナー ================= */
#overlay { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
#overlay > * { pointer-events: auto; }
#overlay > #dice, #overlay > #banner, #overlay > #bearpop { pointer-events: none; }
#overlay > #hint { pointer-events: none; }

#msg { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--hud-b, 100px) + 14px); width: min(760px, calc(100vw - 360px)); min-height: 120px;
  background: linear-gradient(#c8282a, #8a0e12); border: 4px solid #f6c431; border-radius: 18px; box-shadow: 0 0 0 3px #4a0606, 0 12px 28px rgba(0, 0, 0, .45);
  color: #fff; padding: 18px 26px 18px 120px; font: 800 21px/1.5 var(--f-ui); cursor: pointer; animation: msg-in .18s ease-out; }
@keyframes msg-in { from { transform: translate(-50%, 14px); opacity: 0; } }
#msg .who-face { position: absolute; left: 14px; top: 16px; width: 88px; height: 88px; border-radius: 16px; background: radial-gradient(#fff, #ffe9d6); border: 3px solid #4a0606; display: grid; place-items: center; overflow: hidden; }
#msg .who-face svg, #msg .who-face img { width: 80px; height: 80px; display: block; }
#msg .who { position: absolute; left: 114px; top: -18px; padding: 2px 14px; border-radius: 12px; border: 3px solid #fff; font: 900 16px/1.4 var(--f-ui); box-shadow: 0 0 0 2px #4a0606; }
#msg .who:empty { display: none; }
#msg .txt b { color: #ffe14d; }
#msg .txt .minus { color: #b8e0ff; font-weight: 900; }
#msg .txt .small { font-size: .78em; opacity: .9; display: inline-block; }
#msg .next { position: absolute; right: 16px; bottom: 6px; font-size: 18px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

#dice { position: absolute; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; z-index: 25; }
#dice .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.die { width: 92px; height: 92px; background: linear-gradient(#fff, #eef2f8); border-radius: 20px; border: 4px solid var(--navy); box-shadow: 0 6px 0 #8fa3c2, 0 12px 22px rgba(0, 0, 0, .35); position: relative; }
.die i { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--navy); transform: translate(-50%, -50%); }
.die i.one { width: 26px; height: 26px; background: var(--red); }
.die.rolling { animation: tumble .22s linear infinite; }
@keyframes tumble { 25% { transform: rotate(14deg) translateY(-12px); } 75% { transform: rotate(-14deg) translateY(-4px); } }
.die.land { animation: land .3s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes land { from { transform: scale(1.35); } }
#dice .sum { font: 400 46px var(--f-pop); color: #fff; padding: 2px 26px; background: var(--red); border: 4px solid #fff; border-radius: 30px; box-shadow: 0 0 0 3px #6b0b0b, 0 6px 14px rgba(0, 0, 0, .35); animation: land .3s cubic-bezier(.2, 1.8, .4, 1); }

#banner { position: absolute; left: 10px; right: 10px; top: 34%; display: flex; justify-content: center; z-index: 28; }
#banner .bn { max-width: 100%; padding: 12px 44px 16px; background: linear-gradient(#fff27f, #f5b800); border: 5px solid #fff; border-radius: 24px; box-shadow: 0 0 0 4px #7a4a00, 0 12px 26px rgba(0, 0, 0, .35); text-align: center; animation: pop-in .38s cubic-bezier(.2, 1.6, .4, 1); }
#banner .bn-main { font: 400 50px/1.15 var(--f-pop); color: #d0161b; text-shadow: 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 0 6px 0 rgba(122, 74, 0, .35); }
#banner .bn-sub { font: 900 20px var(--f-ui); color: #5a3400; margin-top: 4px; }
#banner.out .bn { animation: pop-out .25s ease-in forwards; }
#banner.ev .bn { background: linear-gradient(#e2c8ff, #a46ee8); box-shadow: 0 0 0 4px #4a1a8a, 0 12px 26px rgba(0, 0, 0, .35); }
#banner.ev .bn-main { color: #5a1aa8; }
#banner.hap .bn { background: linear-gradient(#c8ccd6, #6a707e); box-shadow: 0 0 0 4px #1e2128, 0 12px 26px rgba(0, 0, 0, .35); }
#banner.hap .bn-main { color: #1e2128; }
#banner.farm .bn { background: linear-gradient(#d8f6b8, #6cc048); box-shadow: 0 0 0 4px #1f5a12, 0 12px 26px rgba(0, 0, 0, .35); }
#banner.farm .bn-main { color: #1f6a12; }
#banner.fest .bn { background: linear-gradient(#ff7a6a, #c81e1e); box-shadow: 0 0 0 4px #f6c431, 0 0 0 8px #6a0a0a, 0 12px 26px rgba(0, 0, 0, .35); }

function knotMap(knots, v) {
  const asc = knots[0][0] < knots[knots.length - 1][0];
  for (let i = 0; i < knots.length - 1; i++) {
    const [a, x0] = knots[i], [b, x1] = knots[i + 1];
    const last = i === knots.length - 2;
    if ((asc ? v <= b : v >= b) || last) return x0 + (x1 - x0) * (v - a) / (b - a);
  }
  return 0;

/* 中国大陸すごろく — イラスト描画（背景の地図・季節の重ねがき・キャラクター・アイコン・名所） */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 点列をなめらかな曲線(Catmull-Rom)のSVGパスに
function smoothPath(pts, closed = true) {
  const n = pts.length;
  const P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)},${c2[0].toFixed(1)},${c2[1].toFixed(1)},${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return closed ? d + 'Z' : d;
}

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

const GEO = {
  china: projAll(CHINA_MAIN), taiwan: projAll(CHINA_TAIWAN), hainan: projAll(CHINA_HAINAN),
  seaEast: projAll(SEA_EAST), seaBengal: projAll(SEA_BENGAL), others: OTHER_LANDS.map(projAll),
};
GEO.lands = [GEO.china, GEO.taiwan, GEO.hainan];
const inChina = (x, y) => GEO.lands.some(p => pointInPoly(x, y, p));
const inSea = (x, y) => (pointInPoly(x, y, GEO.seaEast) || pointInPoly(x, y, GEO.seaBengal)) && !GEO.others.some(p => pointInPoly(x, y, p)) && !inChina(x, y);
// 地形の楕円を地図の座標に
const TERRAIN_PX = TERRAIN.map(([lon, lat, rlon, rlat, kind]) => {
  const [x, y] = proj(lon, lat), [x1] = proj(lon + rlon, lat), [, y1] = proj(lon, lat - rlat);
  return { x, y, rx: Math.abs(x1 - x), ry: Math.abs(y1 - y), kind };
});
// 重なっているときは、あとに描く（上にある）地形を返す
function terrainAt(x, y) {
  let k = null;
  for (const t of TERRAIN_PX) { const dx = (x - t.x) / t.rx, dy = (y - t.y) / t.ry; if (dx * dx + dy * dy < 1) k = t.kind; }
  return k;
}

function drawPeak(ctx, x, base, w, h, pal, rnd, snowFrac = 0.4) {
  const top = base - h;
  const L = x - w / 2, R = x + w / 2;
  const pk = x + (rnd() - 0.5) * w * 0.12;
  const left = [[L, base]];
  for (let i = 1; i < 3; i++) {
    const t = i / 3;
    left.push([L + (pk - L) * t + (rnd() - 0.5) * w * 0.05, base - h * Math.pow(t, 1.15) + (rnd() - 0.5) * h * 0.08]);
  }
  const right = [];
  for (let i = 1; i < 3; i++) {
    const t = i / 3;
    right.push([pk + (R - pk) * t + (rnd() - 0.5) * w * 0.05, top + h * Math.pow(t, 0.9) + (rnd() - 0.5) * h * 0.08]);
  }
  const outline = [...left, [pk, top], ...right, [R, base]];
  ctx.beginPath();
  outline.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  ctx.fillStyle = pal.lit; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(pk, top - 2); ctx.lineTo(R + 2, base); ctx.lineTo(pk + w * 0.06, base); ctx.lineTo(pk + w * 0.02, top + h * 0.55); ctx.lineTo(pk - w * 0.04, top + h * 0.35);
  ctx.closePath(); ctx.fillStyle = pal.dark; ctx.fill();
  ctx.strokeStyle = pal.dark; ctx.lineWidth = Math.max(1, w * 0.012);
  for (let i = 0; i < 3; i++) {
    const sx = pk - w * (0.08 + i * 0.1);
    ctx.beginPath(); ctx.moveTo(sx, top + h * (0.25 + i * 0.12)); ctx.lineTo(sx - w * 0.06, base); ctx.stroke();
  }
  if (pal.cap && snowFrac > 0) {
    const sl = top + h * snowFrac;
    ctx.beginPath();
    ctx.moveTo(L - 5, top - 5); ctx.lineTo(R + 5, top - 5); ctx.lineTo(R + 5, sl);
    for (let i = 7; i >= 0; i--) { const xx = L + (R - L) * i / 7; ctx.lineTo(xx, sl + (i % 2 ? h * 0.12 : -h * 0.02) + (rnd() - 0.5) * h * 0.06); }
    ctx.closePath(); ctx.fillStyle = pal.cap; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.beginPath(); ctx.moveTo(pk, top - 2); ctx.lineTo(R + 2, base); ctx.lineTo(pk + w * 0.05, base); ctx.lineTo(pk + w * 0.01, top + h * 0.5); ctx.closePath();
    ctx.fillStyle = pal.capDark; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();
  outline.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = pal.line; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55; ctx.stroke(); ctx.globalAlpha = 1;
}
function drawConifer(ctx, x, y, s, c1 = '#2c7637', c2 = '#3f9446') {
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - s * 0.12, y - s * 0.3, s * 0.24, s * 0.35);
  ctx.beginPath(); ctx.moveTo(x, y - s * 2.3); ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.lineTo(x + s * 0.8, y - s * 0.2); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x, y - s * 2.3); ctx.lineTo(x - s * 0.8, y - s * 0.2); ctx.lineTo(x - s * 0.05, y - s * 0.2); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill();
}
function drawRoundTree(ctx, x, y, s, c1 = '#4c9b3a', c2 = '#72bd55') {
  ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - s * 0.14, y - s * 0.6, s * 0.28, s * 0.65);
  ctx.beginPath(); ctx.arc(x, y - s * 1.2, s, 0, Math.PI * 2); ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath(); ctx.arc(x - s * 0.3, y - s * 1.5, s * 0.5, 0, Math.PI * 2); ctx.fillStyle = c2; ctx.fill();
}
function drawPalm(ctx, x, y, s) {
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = s * 0.28; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s * 0.3, y - s, x + s * 0.2, y - s * 2); ctx.stroke();
  ctx.fillStyle = '#3d9a3a';
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.75;
    ctx.beginPath(); ctx.ellipse(x + s * 0.2 + Math.cos(a) * s * 0.7, y - s * 2 + Math.sin(a) * s * 0.4, s * 0.8, s * 0.25, a, 0, Math.PI * 2); ctx.fill();
  }
}
function strokeRiver(ctx, pts, w = 7) {
  const p = new Path2D(smoothPath(pts, false));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#3f8fd0'; ctx.lineWidth = w + 2.5; ctx.stroke(p);
  ctx.strokeStyle = '#6dbaf0'; ctx.lineWidth = w; ctx.stroke(p);
  ctx.strokeStyle = '#b8e3fb'; ctx.lineWidth = Math.max(1.2, w * 0.3); ctx.stroke(p);
}
function drawLake(ctx, x, y, rx, ry, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0, 0, rx + 3, ry + 3, 0, 0, Math.PI * 2); ctx.fillStyle = '#e9f2c9'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  const g = ctx.createLinearGradient(0, -ry, 0, ry); g.addColorStop(0, '#79c3f2'); g.addColorStop(1, '#3d8fd6');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#2f78b8'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-rx * 0.5 + i * rx * 0.3, -ry * 0.25 + i * ry * 0.25); ctx.lineTo(-rx * 0.25 + i * rx * 0.3, -ry * 0.25 + i * ry * 0.25); ctx.stroke(); }
  ctx.restore();
}
const polyPath = pts => new Path2D(smoothPath(pts));

/* ---------------- 背景マップ ---------------- */
function paintBackground(canvas, k) {
  canvas.width = Math.round(WORLD_W * k); canvas.height = Math.round(WORLD_H * k);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const rnd = mulberry32(20261011);
  const chinaP = polyPath(GEO.china), twP = polyPath(GEO.taiwan), hnP = polyPath(GEO.hainan);
  const seaP = new Path2D(); seaP.addPath(polyPath(GEO.seaEast)); seaP.addPath(polyPath(GEO.seaBengal));
  const othersP = GEO.others.map(polyPath);

  // まわりの国（陸地）
  let g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  g.addColorStop(0, '#d4d2a2'); g.addColorStop(0.55, '#d8cf9e'); g.addColorStop(1, '#a9cc86');
  ctx.fillStyle = g; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    if (inChina(x, y) || inSea(x, y)) continue;
    const s = 3.4 + rnd() * 3;
    const south = y > 1900;
    if (south) rnd() < 0.5 ? drawRoundTree(ctx, x, y, s, '#5d9a48', '#7cb862') : drawPalm(ctx, x, y, s * 0.9);
    else if (rnd() < 0.5) drawConifer(ctx, x, y, s, '#6f9255', '#86a868');
    else { ctx.fillStyle = 'rgba(150,140,90,.35)'; ctx.beginPath(); ctx.ellipse(x, y, s * 2.2, s * 0.8, 0, 0, Math.PI * 2); ctx.fill(); }
  }

  // 海
  ctx.save(); ctx.clip(seaP);
  g = ctx.createLinearGradient(0, 600, WORLD_W, WORLD_H);
  g.addColorStop(0, '#5fb6ea'); g.addColorStop(1, '#2d7ccc');
  ctx.fillStyle = g; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  // 浅瀬の明るいふち
  ctx.lineJoin = 'round';
  for (const [w, c] of [[60, 'rgba(140,215,245,.35)'], [30, 'rgba(170,230,250,.5)'], [12, 'rgba(210,245,255,.6)']]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    [chinaP, twP, hnP, ...othersP].forEach(p => ctx.stroke(p));
  }
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let i = 0; i < 700; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    if (!inSea(x, y)) continue;
    ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.quadraticCurveTo(x - 4, y - 4, x, y); ctx.quadraticCurveTo(x + 4, y - 4, x + 8, y); ctx.stroke();
  }
  ctx.restore();
  // 日本・朝鮮・フィリピンなど
  for (const p of othersP) { ctx.fillStyle = '#d6cf9c'; ctx.fill(p); ctx.strokeStyle = '#b4a878'; ctx.lineWidth = 2; ctx.stroke(p); }

  // まわりの山
  const outerMts = [];
  for (const [ptsLL, n, wmin, wmax, snow] of RANGES) {
    const pts = projAll(ptsLL);
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : i / (n - 1), seg = t * (pts.length - 1), j = Math.min(pts.length - 2, Math.floor(seg)), f = seg - j;
      const x = pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f + (rnd() - 0.5) * 22;
      const y = pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f + (rnd() - 0.5) * 22;
      outerMts.push({ x, y, w: wmin + rnd() * (wmax - wmin), snow, inside: inChina(x, y - 10) });
    }
  }
  outerMts.filter(m => !m.inside).sort((a, b) => a.y - b.y).forEach(m => drawPeak(ctx, m.x, m.y, m.w, m.w * 0.6, m.snow ? MT_PAL.dull : MT_PAL.green, rnd, m.snow));

  // ---- 中国 ----
  ctx.save();
  ctx.shadowColor = 'rgba(40,70,20,.45)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 7;
  ctx.fillStyle = '#6cb646'; [chinaP, twP, hnP].forEach(p => ctx.fill(p));
  ctx.restore();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#f4ef8c'; ctx.lineWidth = 16; [chinaP, twP, hnP].forEach(p => ctx.stroke(p));
  ctx.strokeStyle = '#d7e866'; ctx.lineWidth = 7; [chinaP, twP, hnP].forEach(p => ctx.stroke(p));

  const land = new Path2D(); land.addPath(chinaP); land.addPath(twP); land.addPath(hnP);
  ctx.save(); ctx.clip(land);
  g = ctx.createLinearGradient(0, 0, 0, WORLD_H);
  g.addColorStop(0, '#8cc84f'); g.addColorStop(0.5, '#72bd45'); g.addColorStop(1, '#4ea83a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  // 地形の色
  const TCOL = {
    arid: ['rgba(226,200,128,.95)', 'rgba(220,194,122,.88)', 'rgba(220,194,122,0)'],
    desert: ['rgba(244,200,120,1)', 'rgba(236,184,100,.95)', 'rgba(236,184,100,0)'],
    plateau: ['rgba(196,178,120,.95)', 'rgba(186,170,112,.85)', 'rgba(186,170,112,0)'],
    loess: ['rgba(232,206,130,.95)', 'rgba(226,196,120,.8)', 'rgba(226,196,120,0)'],
    steppe: ['rgba(206,222,130,.9)', 'rgba(196,214,120,.7)', 'rgba(196,214,120,0)'],
    basin: ['rgba(200,232,120,.95)', 'rgba(184,222,110,.6)', 'rgba(184,222,110,0)'],
    plain: ['rgba(210,236,128,.95)', 'rgba(192,226,112,.6)', 'rgba(192,226,112,0)'],
  };
  for (const t of TERRAIN_PX) {
    const R = Math.max(t.rx, t.ry), c = TCOL[t.kind];
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.rx / R, t.ry / R);
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    rg.addColorStop(0, c[0]); rg.addColorStop(0.72, c[1]); rg.addColorStop(1, c[2]);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 砂丘のもよう
  ctx.strokeStyle = 'rgba(200,140,60,.45)'; ctx.lineWidth = 2;
  for (let i = 0; i < 900; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    if (terrainAt(x, y) !== 'desert') continue;
    ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.quadraticCurveTo(x, y - 7, x + 12, y); ctx.stroke();
  }
  // 田畑
  const fieldCols = ['#d9ea8a', '#c4e07a', '#e8ec9c', '#acd468', '#f0e59a'];
  for (let i = 0; i < 1600; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    const tk = terrainAt(x, y);
    if (tk !== 'plain' && tk !== 'basin' && tk !== 'loess') continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate((rnd() - 0.5) * 0.5);
    ctx.fillStyle = tk === 'loess' ? (rnd() < 0.5 ? '#ecd59a' : '#dcc07a') : fieldCols[i % 5]; ctx.globalAlpha = 0.85;
    ctx.fillRect(-8 - rnd() * 6, -4 - rnd() * 3, 16 + rnd() * 10, 8 + rnd() * 6);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 川と湖
  for (const r of RIVERS) strokeRiver(ctx, projAll(r.pts), r.w);
  for (const [lon, lat, rlon, rlat, rot] of LAKES) {
    const [x, y] = proj(lon, lat), [x1] = proj(lon + rlon, lat), [, y1] = proj(lon, lat - rlat);
    drawLake(ctx, x, y, Math.max(5, Math.abs(x1 - x)), Math.max(4, Math.abs(y1 - y)), rot);
  }

  // 国内の山
  ctx.save(); ctx.clip(land);
  outerMts.filter(m => m.inside).sort((a, b) => a.y - b.y).forEach(m => {
    const pal = m.snow ? (terrainAt(m.x, m.y) === 'plateau' || terrainAt(m.x, m.y) === 'desert' ? MT_PAL.rock : MT_PAL.snow) : MT_PAL.green;
    drawPeak(ctx, m.x, m.y, m.w, m.w * 0.62, pal, rnd, m.snow);
  });
  // 森
  for (let i = 0; i < 6500; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    if (!inChina(x, y)) continue;
    const tk = terrainAt(x, y);
    if (tk === 'desert' || tk === 'plateau' || tk === 'arid') { if (rnd() < 0.96) continue; }
    else if (tk === 'steppe' || tk === 'loess') { if (rnd() < 0.85) continue; }
    else if (unprojLon(x) < 101 && unprojLat(y) > 30.5) { if (rnd() < 0.85) continue; }
    else if (tk) { if (rnd() < 0.75) continue; }
    const s = 3.8 + rnd() * 3.6;
    if (y > 2150 && rnd() < 0.35) drawPalm(ctx, x, y, s);
    else if (y < 900 || rnd() < 0.4) drawConifer(ctx, x, y, s);
    else drawRoundTree(ctx, x, y, s * 0.85);
  }
  ctx.restore();

  ctx.strokeStyle = '#3f7d2b'; ctx.lineWidth = 2.6; [chinaP, twP, hnP].forEach(p => ctx.stroke(p));
}

/* 季節の重ねがき（冬は北が雪げしき、秋は紅葉、春は桃の花と菜の花、夏はひまわりとラベンダー） */
function paintSeasonLayer(canvas, s) {
  const k = 0.5;
  canvas.width = Math.round(WORLD_W * k); canvas.height = Math.round(WORLD_H * k);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, WORLD_W, WORLD_H);
  const rnd = mulberry32(s.charCodeAt(0) * 977);
  const land = new Path2D(); GEO.lands.forEach(p => land.addPath(polyPath(p)));
  const dots = (n, cols, test, rmin, rmax) => {
    for (let i = 0; i < n; i++) {
      const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
      if (!test(x, y)) continue;
      ctx.fillStyle = cols[i % cols.length];
      ctx.beginPath(); ctx.arc(x, y, rmin + rnd() * (rmax - rmin), 0, Math.PI * 2); ctx.fill();
    }
  };
  const [, y35] = proj(0, 35.5), [, y40] = proj(0, 40), [x103] = proj(103, 0);
  if (s === 'f') {
    let g = ctx.createLinearGradient(0, 0, 0, y35 + 120);
    g.addColorStop(0, 'rgba(255,255,255,.66)'); g.addColorStop(0.75, 'rgba(255,255,255,.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, WORLD_W, y35 + 120);
    ctx.save(); ctx.clip(land);
    g = ctx.createLinearGradient(x103 + 60, 0, 0, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.2, 'rgba(240,246,255,.38)'); g.addColorStop(1, 'rgba(240,246,255,.38)');
    ctx.fillStyle = g; ctx.fillRect(0, y35, x103 + 60, 700);
    ctx.restore();
    dots(5000, ['rgba(255,255,255,.9)', 'rgba(235,242,255,.85)'], (x, y) => y < y35 || (x < x103 && y < 1900), 1.5, 4);
  } else if (s === 'a') {
    dots(5200, ['rgba(232,110,40,.75)', 'rgba(214,64,40,.7)', 'rgba(240,176,48,.75)', 'rgba(196,90,30,.65)'],
      (x, y) => inChina(x, y) && y > 250 && y < 2250 && !['desert', 'plateau', 'arid'].includes(terrainAt(x, y)), 2.5, 6);
    ctx.save(); ctx.clip(land);
    ctx.fillStyle = 'rgba(240,190,80,.12)'; ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.restore();
  } else if (s === 'h') {
    dots(4200, ['rgba(255,150,196,.8)', 'rgba(255,196,220,.85)', 'rgba(255,240,246,.9)'], (x, y) => inChina(x, y) && x > x103 - 100 && y > y40 - 100, 2.5, 5.5);
    for (const [lon, lat, r] of [[107.0, 33.1, 60], [117.9, 29.3, 50], [100.6, 37.3, 60], [104.3, 24.9, 50], [113.2, 30.5, 40]]) {
      const [cx, cy] = proj(lon, lat);
      dots(900, ['rgba(255,226,40,.85)', 'rgba(250,206,20,.8)'], (x, y) => Math.hypot(x - cx, y - cy) < r, 2, 4.5);
    }
  } else {
    ctx.save(); ctx.clip(land);
    ctx.fillStyle = 'rgba(30,140,60,.08)'; ctx.fillRect(0, y35, WORLD_W, WORLD_H);
    ctx.restore();
    for (const [lon, lat, r, cols] of [[81.3, 44.0, 70, ['rgba(160,110,220,.85)', 'rgba(190,150,240,.85)']], [125.3, 45.2, 80, ['rgba(255,210,30,.85)', 'rgba(240,180,20,.85)']], [100.3, 37.4, 55, ['rgba(255,226,40,.85)']], [113.4, 43.0, 90, ['rgba(255,210,30,.7)']]]) {
      const [cx, cy] = proj(lon, lat);
      dots(1200, cols, (x, y) => Math.hypot(x - cx, y - cy) < r, 2, 4.5);
    }
  }
}

/* 全体図（エリア塗り分け） */
function paintMinimap(canvas, w, h) {
  const k = 2;
  canvas.width = w * k; canvas.height = h * k;
  const ctx = canvas.getContext('2d');
  const xs = GEO.china.map(p => p[0]), ys = [...GEO.china, ...GEO.hainan].map(p => p[1]);
  const x0 = Math.min(...xs) - 10, x1 = Math.max(...xs, ...GEO.taiwan.map(p => p[0])) + 10, y0 = Math.min(...ys) - 10, y1 = Math.max(...ys) + 10;
  const sc = Math.min((w - 8) / (x1 - x0), (h - 8) / (y1 - y0));
  const ox = (w - (x1 - x0) * sc) / 2, oy = (h - (y1 - y0) * sc) / 2;
  const toStage = (px, py) => [x0 + (px / k - ox) / sc, y0 + (py / k - oy) / sc];
  const img = ctx.createImageData(canvas.width, canvas.height);
  const areaIdx = new Int8Array(canvas.width * canvas.height).fill(-1);
  const pts = STATIONS.map(s => [...LAYOUT.st[s.id], AREA_ORDER.indexOf(s.area)]);
  const cols = AREA_ORDER.map(a => { const c = AREAS[a].color; return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); });
  for (let py = 0; py < canvas.height; py++) {
    for (let px = 0; px < canvas.width; px++) {
      const [sx, sy] = toStage(px, py);
      if (!inChina(sx, sy)) continue;
      let best = 1e12, bi = 0;
      for (const p of pts) { const d = (p[0] - sx) ** 2 + (p[1] - sy) ** 2; if (d < best) { best = d; bi = p[2]; } }
      areaIdx[py * canvas.width + px] = bi;
    }
  }
  for (let py = 0; py < canvas.height; py++) {
    for (let px = 0; px < canvas.width; px++) {
      const i = py * canvas.width + px, a = areaIdx[i];
      if (a < 0) continue;
      const r = px + 1 < canvas.width ? areaIdx[i + 1] : a, d = py + 1 < canvas.height ? areaIdx[i + canvas.width] : a;
      const edge = (r !== a && r >= 0) || (d !== a && d >= 0);
      const c = edge ? [255, 255, 255] : cols[a];
      img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  ctx.setTransform(k * sc, 0, 0, k * sc, k * (ox - x0 * sc), k * (oy - y0 * sc));
  ctx.lineWidth = 2.4 / sc; ctx.strokeStyle = '#ffffff';
  GEO.lands.forEach(p => ctx.stroke(polyPath(p)));
  return { sc, ox, oy, x0, y0, w, h };
}

/* 中国大陸すごろく — ボード（路線グラフ構築と地図SVG描画） */

const SVGNS = 'http://www.w3.org/2000/svg';
const LABEL_MAX_TEXT = 124;
const SQ_GAP = 44;   // マスの間隔（マスとマスの間に線路が見えるくらい）
const SQ_SCALE = 1.2; // マスの大きさ（絵は 22px で描いてあるのを拡大）

const Board = {
  nodes: [], adj: [], stNode: {}, hubNode: {}, edges: [], special: { air: [], port: [] },
  stById: Object.fromEntries(STATIONS.map(s => [s.id, s])),
  hubById: Object.fromEntries(HUBS.map(h => [h.id, h])),
};

function svgEl(tag, attrs = {}, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

// 地域：西（高原・砂漠）／北／南
function zoneAt(x, y) {
  const lon = unprojLon(x), lat = unprojLat(y);
  if (lon < 103 && lat > 28.5) return 'west';
  return lat >= 33.5 ? 'north' : 'south';
}

function buildBoard() {
  const B = Board;
  B.nodes = []; B.adj = []; B.edges = [];
  const add = n => { n.i = B.nodes.length; n.zone = zoneAt(n.x, n.y); B.nodes.push(n); B.adj.push([]); return n.i; };

  // ラベル幅は文字数から決める（フォントの読み込み状況でマス配置が変わらないように）
  for (const s of STATIONS) {
    const est = [...s.n].reduce((a, ch) => a + (ch.charCodeAt(0) < 128 ? 9 : 14.2), 0);
    const textW = Math.min(est, LABEL_MAX_TEXT);
    const [x, y] = LAYOUT.st[s.id];
    B.stNode[s.id] = add({ kind: 'station', sid: s.id, x, y, w: Math.round(30 + textW + 10), h: 28, textW, squeeze: est > LABEL_MAX_TEXT });
  }
  for (const h of HUBS) { const [x, y] = LAYOUT.hub[h.id]; B.hubNode[h.id] = add({ kind: 'hub', hid: h.id, x, y, w: 36, h: 36 }); }

  const nodeOf = key => typeof key === 'number' ? B.stNode[key] : B.hubNode[key];
  const rnd = mulberry32(8848);
  const pickType = sea => {
    const r = rnd();
    if (sea) return r < 0.55 ? 'blue' : r < 0.75 ? 'yellow' : 'event';
    return r < 0.36 ? 'blue' : r < 0.52 ? 'red' : r < 0.62 ? 'yellow' : r < 0.73 ? 'event' : r < 0.80 ? 'hap' : r < 0.86 ? 'farm' : r < 0.91 ? 'fest' : r < 0.96 ? 'rail' : 'blue';
  };

  for (const [ka, kb, bend = 0, sea = 0] of LAYOUT.edges) {
    const a = B.nodes[nodeOf(ka)], b = B.nodes[nodeOf(kb)];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    const cx = (a.x + b.x) / 2 + (-dy / len) * bend, cy = (a.y + b.y) / 2 + (dx / len) * bend;
    const N = 200, pts = [], acc = [0];
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      pts.push([u * u * a.x + 2 * u * t * cx + t * t * b.x, u * u * a.y + 2 * u * t * cy + t * t * b.y]);
      if (i) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const inside = (n, p, pad) => Math.abs(p[0] - n.x) <= n.w / 2 + pad && Math.abs(p[1] - n.y) <= n.h / 2 + pad;
    let i0 = 0; while (i0 < N && inside(a, pts[i0], 2)) i0++;
    let i1 = N; while (i1 > 0 && inside(b, pts[i1], 2)) i1--;
    const L = Math.max(0, acc[i1] - acc[i0]);
    const k = Math.max(0, Math.floor(L / SQ_GAP) - 1);
    const chain = [a.i];
    for (let j = 1; j <= k; j++) {
      const target = acc[i0] + L * j / (k + 1);
      let idx = i0; while (idx < i1 && acc[idx] < target) idx++;
      chain.push(add({ kind: 'sq', type: pickType(sea), sea: !!sea, x: pts[idx][0], y: pts[idx][1], w: 26, h: 26 }));
    }
    chain.push(b.i);
    for (let j = 0; j < chain.length - 1; j++) { B.adj[chain[j]].push(chain[j + 1]); B.adj[chain[j + 1]].push(chain[j]); }
    B.edges.push({ a: a.i, b: b.i, chain, sea: !!sea, d: `M${a.x},${a.y}Q${cx.toFixed(1)},${cy.toFixed(1)},${b.x},${b.y}` });
  }
  // 連続する赤マス・！マスを減らす
  for (const e of B.edges) {
    for (let j = 1; j < e.chain.length - 1; j++) {
      const n = B.nodes[e.chain[j]], prev = B.nodes[e.chain[j - 1]];
      if ((n.type === 'red' || n.type === 'hap') && (prev.type === 'red' || prev.type === 'hap')) n.type = 'blue';
    }
  }
  // 空港・港・パンダのマス（指定した場所にいちばん近いマス）
  const nearestSq = (lon, lat, used, maxD = 260) => {
    const [x, y] = proj(lon, lat);
    let best = -1, bd = maxD;
    for (const n of B.nodes) {
      if (n.kind !== 'sq' || n.sea || used.has(n.i)) continue;
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < bd) { bd = d; best = n.i; }
    }
    return best;
  };
  const used = new Set();
  const place = (spots, type) => spots.forEach(([lon, lat, name]) => {
    const i = nearestSq(lon, lat, used);
    if (i < 0) return;
    used.add(i); B.nodes[i].type = type;
    if (type === 'air' || type === 'port') { B.special[type].push(i); B.nodes[i].place = name + (type === 'air' ? '空港' : '港'); }
  });
  B.special = { air: [], port: [] };
  place(AIR_SPOTS, 'air'); place(PORT_SPOTS, 'port'); place(PANDA_SPOTS, 'panda');
}

/* 最短距離(BFS) */
function bfsFrom(start) {
  const dist = new Array(Board.nodes.length).fill(Infinity);
  dist[start] = 0; const q = [start];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    for (const v of Board.adj[u]) if (dist[v] === Infinity) { dist[v] = dist[u] + 1; q.push(v); }
  }
  return dist;
}
const BfsCache = { key: -1, dist: null };
function distToNode(target) {
  if (BfsCache.key !== target) { BfsCache.key = target; BfsCache.dist = bfsFrom(target); }
  return BfsCache.dist;
}

/* サイコロの目でちょうど止まれるマス（双六と同じく、目的地もぴったりの目でしか止まれない） */
function reachable(start, steps) {
  const result = new Map();
  let layer = [{ node: start, prev: -1, path: [start] }];
  for (let s = 1; s <= steps; s++) {
    const next = new Map();
    for (const st of layer) {
      const nbs = Board.adj[st.node];
      for (const nb of nbs) {
        if (nb === st.prev && nbs.length > 1) continue;
        const key = nb + ':' + st.node;
        if (!next.has(key)) next.set(key, { node: nb, prev: st.node, path: st.path.concat(nb) });
      }
    }
    layer = [...next.values()];
  }
  for (const st of layer) if (!result.has(st.node)) result.set(st.node, st.path);
  return result;
}

function renderBoard(svg) {
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${WORLD_W} ${WORLD_H}`);
  const defs = svgEl('defs', {}, svg);
  defs.innerHTML = `
    <linearGradient id="g-hub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#f2b632"/></linearGradient>
    <clipPath id="tok-clip"><circle r="15.5"/></clipPath>
    <filter id="f-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.2" flood-color="#0c1a3a" flood-opacity=".45"/></filter>
    ${squareDefs()}`;

  defs.insertAdjacentHTML('beforeend', AREA_ORDER.map(a => `<linearGradient id="g-st-${a}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${AREAS[a].color}"/><stop offset="1" stop-color="${AREAS[a].dark}"/></linearGradient>`).join(''));

  // ---- 地面（盤面と同じ面に描くもの） ----
  const L = id => svgEl('g', { id }, svg);
  const gNb = L('lyr-neighbors'), gRails = L('lyr-rails'), gSq = L('lyr-squares'), gSeason = L('lyr-season'),
    gHub = L('lyr-hubs'), gSt = L('lyr-stations'), gMarks = L('lyr-marks'), gHl = L('lyr-hl');

  for (const [n, lon, lat] of NEIGHBOR_LABELS) {
    const [x, y] = proj(lon, lat);
    const t = svgEl('text', { x, y, class: 'nb-label', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, gNb);
    t.textContent = n;
  }
  for (const [n, lon, lat] of SEA_LABELS) {
    const [x, y] = proj(lon, lat);
    const t = svgEl('text', { x, y, class: 'sea-label', 'text-anchor': 'middle', 'dominant-baseline': 'middle' }, gNb);
    t.textContent = n;
  }
  for (const [cls, sea] of [['rail-base', 0], ['rail-white', 0], ['rail-dash', 0], ['sea-base', 1], ['sea-dash', 1]]) {
    const g = svgEl('g', { class: cls }, gRails);
    for (const e of Board.edges) if (e.sea === !!sea) svgEl('path', { d: e.d }, g);
  }
  for (const n of Board.nodes) {
    if (n.kind === 'sq') {
      n.el = svgEl('use', { href: `#sq-${n.type}`, transform: `translate(${n.x.toFixed(1)},${n.y.toFixed(1)}) scale(${SQ_SCALE})`, class: 'sq', 'data-node': n.i }, gSq);
    } else if (n.kind === 'hub') {
      const g = svgEl('g', { class: 'hub', transform: `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`, 'data-node': n.i }, gHub);
      n.el = g;
      svgEl('rect', { x: -18, y: -18, width: 36, height: 36, rx: 8, class: 'hub-out' }, g);
      svgEl('rect', { x: -15, y: -15, width: 30, height: 30, rx: 6, fill: 'url(#g-hub)', class: 'hub-in' }, g);
      svgEl('rect', { x: -11, y: -12, width: 22, height: 7, rx: 3.5, fill: 'rgba(255,255,255,.5)' }, g);
    }
  }
  // 駅の台座（名前の看板は #bb に立てる）
  for (const s of STATIONS) {
    const n = Board.nodes[Board.stNode[s.id]];
    const g = svgEl('g', { class: 'st', transform: `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`, 'data-sid': s.id, 'data-node': n.i }, gSt);
    n.el = g;
    const x0 = -n.w / 2;
    svgEl('rect', { x: x0 - 2, y: -16, width: n.w + 4, height: 32, rx: 9, class: 'st-out' }, g);
    svgEl('rect', { x: x0, y: -14, width: n.w, height: 28, rx: 7, fill: `url(#g-st-${s.area})`, class: 'st-in' }, g);
    svgEl('rect', { x: x0 + 5, y: -11, width: n.w - 10, height: 7, rx: 3.5, fill: 'rgba(255,255,255,.45)' }, g);
  }

  // ---- 立てて見せるもの（看板・ターミナル・名所）。画面の座標はカメラが計算する（camera.js の addBillboard） ----
  const bb = document.getElementById('bbov');
  const put = (cls, x, y, html, attrs = '', zb = 0) => {
    const t = document.createElement('template');
    t.innerHTML = `<div class="bb ${cls}" ${attrs}>${html}</div>`;
    const el = t.content.firstElementChild;
    addBillboard(el, x, y, zb);
    return el;
  };
  for (const [kind, lon, lat, sc = 1] of DECOR) {
    const [x, y] = proj(lon, lat);
    const el = put('decor', x, y, `<svg class="in" viewBox="-60 -60 120 90" width="${120 * sc}" height="${90 * sc}" aria-hidden="true"><g>${LANDMARKS[kind]}</g></svg>`);
    el.dataset.s = sc;
  }
  // 名所の絵の大きさに合わせて、下のはしを地面にそろえる
  for (const el of bb.querySelectorAll('.decor')) {
    const svgE = el.firstElementChild, sc = +el.dataset.s;
    try {
      const b = svgE.firstElementChild.getBBox();
      if (b.width > 0) {
        svgE.setAttribute('viewBox', `${(b.x - 3).toFixed(1)} ${(b.y - 3).toFixed(1)} ${(b.width + 6).toFixed(1)} ${(b.height + 5).toFixed(1)}`);
        svgE.setAttribute('width', ((b.width + 6) * sc).toFixed(1)); svgE.setAttribute('height', ((b.height + 5) * sc).toFixed(1));
      }
    } catch (e) { /* 大きさがとれないときはそのまま */ }
  }
  for (const n of Board.nodes) {
    if (n.kind !== 'hub') continue;
    const h = Board.hubById[n.hid];
    n.sign = put('hubsign', n.x, n.y - 12, `<div class="in"><svg class="shop" viewBox="-17 -17 34 34" width="38" height="38" aria-hidden="true">
      <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#fff8e0" stroke="#7a5a10" stroke-width="2"/>
      <path d="M-12 -2 L-10 -11 L10 -11 L12 -2Z" fill="#e0302f" stroke="#7a1010" stroke-width="1.4"/><path d="M-6 -11 L-5 -2 M0 -11 L0 -2 M6 -11 L5 -2" stroke="#fff" stroke-width="2"/>
      <rect x="-9" y="-2" width="18" height="12" fill="#fff" stroke="#7a5a10" stroke-width="1.4"/><rect x="-3" y="2" width="6" height="8" fill="#7a5a10"/></svg>
      <span class="tag">${h.n}</span><i class="post"></i></div>`, `data-node="${n.i}"`, 2);
  }
  for (const s of STATIONS) {
    const n = Board.nodes[Board.stNode[s.id]];
    n.sign = put('sign', n.x, n.y - 11, `<div class="in"><div class="sg" style="--ac:${AREAS[s.area].color};--acd:${AREAS[s.area].dark}"><span class="no">${s.id}</span><span class="nm">${s.n}</span><span class="own"></span></div><i class="post"></i></div>`,
      `data-sid="${s.id}" data-node="${n.i}"`, 2);
  }
  return { gMarks, gHl, gSeason, bb };
}

/* 中国大陸すごろく — 効果音（WebAudioで合成） */
const Sound = {
  on: true, ctx: null,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    if (this.ctx && typeof Music !== 'undefined') Music.update();   // 最初のタップでBGMも始める
  },
  tone(freq, dur = 0.1, type = 'square', vol = 0.05, when = 0, slideTo = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, type = 'square', vol = 0.05, step = 0.09) { notes.forEach((f, i) => f && this.tone(f, step * 1.1, type, vol, i * step)); },
  play(name) {
    if (this.ctx && typeof Music !== 'undefined' && (name === 'fanfare' || name === 'kessan')) Music.duck(1.8);   // ファンファーレの間はBGMを小さく
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'click': this.tone(880, 0.05, 'square', 0.04); break;
      case 'step': this.tone(660, 0.05, 'triangle', 0.06); this.tone(990, 0.04, 'triangle', 0.03, 0.03); break;
      case 'dice': for (let i = 0; i < 9; i++) this.tone(300 + Math.random() * 500, 0.03, 'square', 0.03, i * 0.08); break;
      case 'coin': this.seq([988, 1319], 'square', 0.05, 0.08); break;
      case 'bad': this.seq([392, 330, 262, 196], 'sawtooth', 0.04, 0.12); break;
      case 'card': this.seq([784, 988, 1175, 1568], 'triangle', 0.06, 0.06); break;
      case 'buy': this.seq([523, 659, 784, 1047], 'square', 0.045, 0.07); break;
      case 'stamp': this.tone(180, 0.12, 'square', 0.08); this.tone(1200, 0.08, 'triangle', 0.05, 0.08); break;
      case 'fanfare': this.seq([523, 523, 523, 659, 0, 587, 659, 784, 784, 1047], 'square', 0.05, 0.11); this.seq([262, 0, 262, 330, 0, 294, 330, 392, 392, 523], 'triangle', 0.05, 0.11); break;
      case 'bear': this.seq([196, 185, 175, 165, 156], 'sawtooth', 0.045, 0.14); break;
      case 'warp': this.tone(300, 0.5, 'sine', 0.07, 0, 1600); break;
      case 'month': this.seq([659, 784, 1047], 'triangle', 0.06, 0.09); break;
      case 'kessan': this.seq([392, 523, 659, 784, 1047, 784, 1047], 'square', 0.045, 0.1); break;
      case 'gong': this.tone(110, 1.6, 'sine', 0.12, 0, 98); this.tone(220, 1.2, 'triangle', 0.05); this.tone(331, 0.9, 'sine', 0.03); break;
      case 'fest': this.seq([587, 659, 784, 880, 1047, 880, 1047, 1175], 'square', 0.045, 0.07); for (let i = 0; i < 8; i++) this.tone(1800 + Math.random() * 1200, 0.03, 'square', 0.03, 0.6 + i * 0.05); break;
      case 'plane': this.tone(500, 0.9, 'sawtooth', 0.025, 0, 900); this.tone(250, 0.9, 'triangle', 0.04, 0, 520); break;
      case 'ship': this.tone(147, 0.5, 'square', 0.05); this.tone(147, 0.7, 'square', 0.05, 0.6); break;
      case 'skip': this.seq([523, 440, 349], 'triangle', 0.06, 0.16); break;
    }
  },
};

/* 中国大陸すごろく — BGM
   曲はすべてこのゲームのためのオリジナル。中国の音楽でよく使われる「五音音階（ド・レ・ミ・ソ・ラ）」で作曲した。
   音声ファイルは使わず、WebAudio でメロディ・ベース・和音・ドラムをその場で演奏する（効果音と同じ AudioContext を使う）。
   場面（タイトル／季節／ボンビーキョンシー／決算）に合わせて、なめらかに曲を切りかえる。 */

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(tok) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(tok);
  if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
function expandScore(str, mult) {
  const out = [];
  for (const t of str.trim().split(/\s+/)) {
    if (t === '|') continue;
    out.push(t);
    for (let i = 1; i < mult; i++) out.push(t === '.' ? '.' : '-');
  }
  return out;
}
function compileVoice(tokens) {
  const ev = new Array(tokens.length).fill(null);
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === '-' || t === '.') continue;
    let d = 1; while (i + d < tokens.length && tokens[i + d] === '-') d++;
    ev[i] = { f: noteFreq(t), d };
  }
  return ev;
}
const CHORD_TONES = {
  C: ['C4', 'E4', 'G4'], G: ['B3', 'D4', 'G4'], Am: ['A3', 'C4', 'E4'], F: ['A3', 'C4', 'F4'], Em: ['B3', 'E4', 'G4'], Dm: ['A3', 'D4', 'F4'],
  D: ['A3', 'D4', 'F#4'], Bm: ['B3', 'D4', 'F#4'], A: ['A3', 'C#4', 'E4'], E7: ['G#3', 'D4', 'E4'], Bb: ['Bb3', 'D4', 'F4'], 'C/E': ['G3', 'C4', 'E4'],
  Gsus: ['C4', 'D4', 'G4'], Dsus: ['D4', 'G4', 'A4'],
};

// lead: 8分音符で1小節8つ ／ bass: bassMult（4=4分音符, 2=8分音符） ／ chords: 半小節ごとの和音 ／ drums: 1小節16文字（k=太鼓 s=銅鑼っぽい音 h=シンバル）

    bass: `D3 A2 D3 A2 | B2 F#2 B2 F#2 | G2 D3 G2 D3 | D3 A2 D3 A2 | G2 D3 G2 B2 | B2 F#2 B2 F#2 | G2 A2 B2 A2 | D3 A2 D3 A2`,

           C6 - A5 - G5 - E5 G5 | A5 - - - G5 - E5 - | D5 - E5 - G5 - E5 D5 | C5 - - - - . G4 A4 |
           C5 - D5 - E5 - G5 E5 | D5 - C5 - A4 - C5 - | D5 - E5 - G5 - A5 G5 | E5 - - - D5 - E5 - |
           G5 - A5 - C6 - A5 G5 | E5 - G5 - D5 - E5 - | C5 - D5 - E5 - G5 E5 | D5 - - - C5 - . .`,
    bass: `C3 G2 C3 G2 | G2 D3 G2 D3 | A2 E3 A2 E3 | G2 D3 G2 B2 | F2 C3 F2 C3 | A2 E3 A2 E3 | G2 D3 G2 D3 | C3 G2 C3 G2
           A2 E3 A2 E3 | F2 C3 F2 C3 | G2 D3 G2 D3 | C3 G2 C3 E3 | F2 C3 F2 A2 | C3 G2 C3 G2 | F2 C3 G2 D3 | C3 G2 C3 G2`,
    chords: 'C C G G Am Am G G F F Am Am G G C C Am Am F F G G C C F F C C F G C C',
    drums: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.' },
    flavors: {

      summer: { bpm: 126, lp: 5200, drums: { k: 'x.....x.x.....x.', s: '....x.......x...', h: 'xxx.xxx.xxx.xxx.' } },

      winter: { bpm: 98, leadType: 'triangle', lp: 6000, bell: true, vib: true, drums: { k: 'x.......x.......', s: '............x...', h: '' } },
    },
  },
  bombee: {  // ボンビーキョンシーのテーマ（ぴょんぴょん跳ねる短調）
    bpm: 112, leadType: 'square', lp: 2600, gate: 0.42, bassMult: 2,
    lead: `A4 . C5 . D5 . E5 . | G5 . E5 . D5 . . . | A4 . C5 . D5 . G5 E5 | D5 . C5 . A4 . . . |
           E5 . G5 . A5 . G5 . | E5 . D5 . C5 . D5 . | E5 . D5 . C5 . G4 A4 | A4 - . . A4 . . .`,
    bass: `A2 . E3 . A2 . E3 . | C3 . G3 . C3 . G3 . | A2 . E3 . A2 . E3 . | D3 . A3 . E3 . . .
           A2 . E3 . C3 . G3 . | G2 . D3 . G2 . D3 . | F2 . C3 . E2 . B2 . | A2 . E3 . A2 . . .`,
    chords: 'Am Am C C Am Am Dm Dm Am Am G G F E7 Am Am',
    drums: { k: 'x.......x.......', s: '....x.......x...', h: '' },

    bpm: 92, leadType: 'triangle', lp: 6000, gate: 0.95, bassMult: 4, vib: true, bell: true,
    lead: `C5 - - - D5 - F5 - | G5 - - - F5 - D5 - | C5 - D5 - F5 - G5 A5 | G5 - - - - - F5 - |
           A5 - G5 - F5 - D5 - | F5 - - - D5 - C5 - | A4 - C5 - D5 - G5 - | F5 - - - - - . .`,
    bass: `F2 - C3 - | Bb1 - F2 - | F2 - C3 - | C2 - G2 - | F2 - C3 - | Bb1 - F2 - | Bb1 - C2 - | F2 - - -`,
    chords: 'F F Bb Bb F F C C F F Bb Bb Bb C F F',
    drums: { k: 'x.......x.......', s: '', h: '' },
  },
