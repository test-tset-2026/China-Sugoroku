function compileSong(name, flavor) {
  const base = SONGS[name], fl = (base.flavors && base.flavors[flavor]) || {};
  const s = { ...base, ...fl };
  const lead = compileVoice(expandScore(s.lead, 2));
  const bass = compileVoice(expandScore(s.bass, s.bassMult));
  const chords = s.chords.split(/\s+/).map(c => (CHORD_TONES[c] || []).map(noteFreq));
  return { ...s, lead, bass, chords, len: lead.length, stepDur: 60 / s.bpm / 4 };
}

const Music = {
  on: true, vol: 0.16, players: [], key: '', timer: null, override: null, master: null, echo: null, noise: null,
  ensure() {
    const ctx = Sound.ctx;
    if (!ctx) return false;
    if (!this.master) {
      this.master = ctx.createGain();
      this.master.gain.value = this.on ? this.vol : 0;
      this.master.connect(ctx.destination);
      const d = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain();
      d.delayTime.value = 0.27; fb.gain.value = 0.26; wet.gain.value = 0.2;
      d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(this.master);
      this.echo = d;
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      this.noise = buf;
    }
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
    return true;
  },
  setOn(on) {
    this.on = on;
    if (!this.master) { if (on) this.update(true); return; }
    this.master.gain.setTargetAtTime(on ? this.vol : 0, Sound.ctx.currentTime, 0.15);
    if (on) this.update(true);
  },
  want() {
    if (this.override) return this.override;
    const start = document.getElementById('start');
    if (typeof G === 'undefined' || !G || (start && !start.hidden)) return 'title';
    if (G.over) return 'kessan';
    if (G.bear !== null && G.bear === G.turn) return 'bombee';
    const s = SEASON_OF(G.month);
    return 'field:' + { h: 'spring', n: 'summer', a: 'autumn', f: 'winter' }[s];
  },
  update(force) {
    if (!this.on || !Sound.ctx || !this.ensure()) return;
    const key = this.want();
    if (!force && key === this.key) return;
    this.key = key;
    this.play(key);
  },
  play(key) {
    const [name, flavor] = key.split(':');
    const ctx = Sound.ctx, now = ctx.currentTime;
    for (const p of this.players) if (!p.stopAt) { p.stopAt = now + 0.9; p.bus.gain.setTargetAtTime(0.0001, now, 0.22); }
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0.0001, now);
    bus.gain.setTargetAtTime(1, now + 0.05, 0.3);
    bus.connect(this.master);
    this.players.push({ song: compileSong(name, flavor), bus, step: 0, next: now + 0.1 });
  },
  tick() {
    const ctx = Sound.ctx;
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    this.players = this.players.filter(p => { if (p.stopAt && now > p.stopAt) { p.bus.disconnect(); return false; } return true; });
    for (const p of this.players) {
      if (p.stopAt) continue;
      if (p.next < now - 0.25) p.next = now + 0.05;
      while (p.next < now + 0.15) {
        this.schedule(p, p.step, p.next);
        p.next += p.song.stepDur;
        p.step = (p.step + 1) % p.song.len;
      }
    }
  },
  duck(sec) {
    if (!this.master || !this.on) return;
    const g = this.master.gain, now = Sound.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setTargetAtTime(this.vol * 0.2, now, 0.05);
    g.setTargetAtTime(this.vol, now + sec, 0.35);
  },
  schedule(p, i, t) {
    const S = p.song, dur = S.stepDur, bus = p.bus;
    const lead = S.lead[i];
    if (lead) {
      this.tone(bus, S.leadType, lead.f, t, lead.d * dur * S.gate, 0.11, S.lp, true, S.vib);
      if (S.bell) this.tone(bus, 'sine', lead.f * 2, t, Math.min(lead.d * dur, 0.4), 0.035, 0, true, false);
    }
    const bass = S.bass[i];
    if (bass) this.tone(bus, 'triangle', bass.f, t, bass.d * dur * 0.92, 0.17, 0, false, false);
    const bi = i % 16;
    if (bi % 4 === 2) for (const f of S.chords[Math.floor(i / 8)] || []) this.tone(bus, 'square', f, t, dur * 1.3, 0.02, 1900, false, false);
    const D = S.drums;
    if (D.k[bi] === 'x') this.kick(bus, t);
    if (D.s[bi] === 'x') this.snare(bus, t);
    if (D.h[bi] === 'x') this.hat(bus, t);
  },
  tone(dest, type, f, t, len, gain, lp, echo, vib) {
    const ctx = Sound.ctx;
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (vib) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = f * 0.007;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 0.12); lfo.stop(t + len + 0.3);
    }
    let node = o;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.setTargetAtTime(gain * 0.65, t + 0.03, 0.09);
    g.gain.setTargetAtTime(0.0001, t + Math.max(0.03, len), 0.035);
    node.connect(g); g.connect(dest);
    if (echo) g.connect(this.echo);
    o.start(t); o.stop(t + len + 0.35);
  },
  kick(dest, t) {
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.42, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.22);
  },
  noiseHit(dest, t, hp, gain, len) {
    const ctx = Sound.ctx, src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise; fl.type = 'highpass'; fl.frequency.value = hp;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(fl); fl.connect(g); g.connect(dest); src.start(t, Math.random() * 0.5); src.stop(t + len + 0.02);
  },
  snare(dest, t) {
    this.noiseHit(dest, t, 1500, 0.16, 0.13);
    const ctx = Sound.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(190, t);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.1);
  },
  hat(dest, t) { this.noiseHit(dest, t, 7000, 0.045, 0.035); },
};

document.addEventListener('visibilitychange', () => {
  const ctx = Sound.ctx;
  if (!ctx) return;
  if (document.hidden) ctx.suspend().catch(() => {});
  else ctx.resume().catch(() => {});
});

/* 中国大陸すごろく — オンライン対戦（信州 道の駅すごろくの仕組みを8人用に広げたもの）
   各プレイヤーは「自分の状態（presence）」を部屋に出し、全員の presence を受け取る。
   ホストのブラウザがゲームを進行し、状態と演出イベントを presence で配る。
   ゲスト（他の社長）は自分の presence で操作の答えを返す。
   通信路は3種類:
   - mqtt  : 無料の公開MQTTサーバー（WebSocket）を中継に使う。ファイルを開くだけで遊べる（ふだんはこれ）
   - claude: claude.ai の Artifact の room 機能（Artifactとして公開したとき）
   - mock  : 開発用。localhost で #mock を付けたとき、同じブラウザのタブどうしをつなぐ */

const NET_V = 1;
const CARD_CODE = { kaisoku: 'k', tokkai: 'b', doche: 's', gaotie: 'S', pittari: 'p', buttobi: 'w', hikouki: 'h', block: 'x', summit: 'm', tokusei: 't', geppei: 'o', hongbao: 'g', ofuda: 'r' };
const CODE_CARD = Object.fromEntries(Object.entries(CARD_CODE).map(([k, v]) => [v, k]));
const ID64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const PROP_KEYS = STATIONS.flatMap(s => s.props.map((_, i) => `${s.id}:${i}`));
const SFX_OK = new Set(['click', 'step', 'dice', 'coin', 'bad', 'card', 'buy', 'stamp', 'fanfare', 'bear', 'warp', 'month', 'kessan', 'gong', 'fest', 'plane', 'ship', 'skip']);
const EV_TYPES = new Set(['say', 'bn', 'ms', 'fx', 'sfx', 'dice', 'mv', 'rl', 'wp', 'ks', 'go', 'turn', 'bp']);
const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

const Net = {
  mode: 'local',          // 'local' | 'host' | 'guest'
  api: undefined,         // room 名前空間（null = 使えない）
  room: null, code: '', cid: '', nick: '',
  seats: Array(MAX_PLAYERS).fill(null),   // {cid, nick} | null
  mySeat: -1, years: 3, np: 4, speed: 'normal', started: false,
  present: new Set(),
  // ホスト
  seq: 0, log: [], prompt: null, pn: 0, waiter: null, absentSince: {},
  // ゲスト
  hostP: null, hostSeen: false, hostGoneTimer: null, want: -1, queue: [], lastQueued: 0, lastPlayed: 0,
  playing: false, latest: null, answeredN: 0, activePrompt: null, skip: null, finalShown: false,
};

(function initCid() {
  try {
    Net.cid = sessionStorage.getItem('chuka-cid') || '';
    if (!Net.cid) { Net.cid = 'c' + Math.random().toString(36).slice(2, 12); sessionStorage.setItem('chuka-cid', Net.cid); }
  } catch (e) { Net.cid = 'c' + Math.random().toString(36).slice(2, 12); }
})();

// 使える通信路を決める。{kind, open(code, pass) => room} か null
async function netApi() {
  if (Net.api !== undefined) return Net.api;
  let t = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const room = await window.claude.use('room');
      if (room) t = { kind: 'claude', open: async () => room };
    } else if (location.hash === '#mock' && window.MockRoom) t = { kind: 'mock', open: async () => window.MockRoom };
    else if ('WebSocket' in window) t = { kind: 'mqtt', open: (code, pass) => openMqttRoom(code, pass) };
  } catch (e) { t = null; }
  Net.api = t;
  return t;
}

/* ---------- 合言葉による暗号化（AES-GCM） ----------
   合言葉と部屋番号から PBKDF2（20万回）で「暗号のカギ」と「部屋の場所（トピック名）」をまとめて作る。
   部屋の場所からも合言葉を速く当てられないよう、どちらも同じ重い計算から取り出す。
   中継サーバーや合言葉を知らない人には、中身も部屋の場所もわからず、偽のデータも作れない。 */
const cryptoOk = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function roomSecrets(code, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(`chuka-tairiku-sugoroku|v1|${code}`), iterations: 200000, hash: 'SHA-256' }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  const topicId = [...bits.slice(32, 48)].map(b => b.toString(16).padStart(2, '0')).join('');
  return { topicId, key };
}
// aad（送り主の名前）も暗号に結びつけるので、他人の発言を別の人のものとして使い回せない
async function sealJson(key, obj, aad) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(aad) }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return b64(iv) + '.' + b64(ct);
}
async function openJson(key, text, aad) {
  const [iv, ct] = text.split('.');
  if (!iv || !ct) throw new Error('format');
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv), additionalData: new TextEncoder().encode(aad) }, key, unb64(ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 公開MQTTサーバー経由の部屋 ---------- */
const MQTT_SRC = ['https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.3/mqtt.min.js', 'https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js'];
// 読みこむライブラリの指紋。CDNの中身がすりかえられていたら読みこまない
const MQTT_SRI = 'sha384-2zQjVyInRn7TzkR04+eX+LIHdeOeDoi4HO1liY/ci1n9bXCb/nBziCckfkazOx6h';
const MQTT_BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081', 'wss://broker.hivemq.com:8884/mqtt'];
const MQTT_ROOT = 'chuka-tairiku-sugoroku/v1';

function loadScript(src, integrity) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.async = true; el.integrity = integrity; el.crossOrigin = 'anonymous';
    el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
async function loadMqtt() {
  if (window.mqtt) return;
  for (const src of MQTT_SRC) { try { await loadScript(src, MQTT_SRI); if (window.mqtt) return; } catch (e) { /* 次を試す */ } }
  throw new Error('mqtt-load');
}
function mqttConnect(url, will) {
  return new Promise((resolve, reject) => {
    const c = window.mqtt.connect(url, {
      clientId: 'chuka_' + Net.cid + '_' + Math.random().toString(36).slice(2, 6),
      clean: true, keepalive: 45, reconnectPeriod: 2000, connectTimeout: 7000, will,
    });
    const timer = setTimeout(() => fail(new Error('timeout')), 8000);
    function ok() { clearTimeout(timer); c.removeListener('error', fail); resolve(c); }
    function fail(e) { clearTimeout(timer); c.removeListener('connect', ok); try { c.end(true); } catch (x) { /* noop */ } reject(e); }
    c.once('connect', ok);
    c.once('error', fail);
  });
}
async function openMqttRoom(code, pass) {
  if (!cryptoOk()) throw new Error('no-crypto');
  const [{ topicId, key }] = await Promise.all([roomSecrets(code, pass), loadMqtt()]);
  const base = `${MQTT_ROOT}/${topicId}/p`;
  const me = Net.cid, myTopic = `${base}/${me}`;
  const aadOf = cid => `${MQTT_ROOT}|${topicId}|${cid}`;
  // 送る順番の番号（時刻ベース）と、この接続の識別子。古いデータの再送（リプレイ）を見分けるのに使う
  const session = b64(crypto.getRandomValues(new Uint8Array(9)));
  let seq = 0;
  const nextSeq = () => (seq = Math.max(seq + 1, Date.now()));
  // 回線が切れたときにサーバーが代わりに出す「退出」も暗号化しておく（他人が偽の退出を出せないように）
  const will = { topic: myTopic, payload: await sealJson(key, { s: session, q: 0, gone: 1 }, aadOf(me)), retain: true, qos: 1 };
  let client = null, err = null;
  for (const url of MQTT_BROKERS) { try { client = await mqttConnect(url, will); break; } catch (e) { err = e; } }
  if (!client) throw err || new Error('connect');

  const peers = new Map();   // cid -> {heard, obj}
  const seen = new Map();    // cid -> {s, q} 最後に受けとった接続と番号
  const handlers = new Set();
  let mine = {}, snap = Object.freeze([]), pubTimer = null, closed = false;
  let pubChain = Promise.resolve(), recvChain = Promise.resolve();
  const toPeer = (cid, presence) => Object.freeze({ peer: cid, by: null, isMe: cid === me, sameTab: cid === me, kind: 'viewer', guest: false, presence, updatedAt: Date.now() });
  const notify = () => {
    snap = Object.freeze([toPeer(me, Object.freeze(mine)), ...[...peers.values()].map(p => p.obj)]);
    handlers.forEach(h => { try { h({ peers: snap, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } });
  };
  // 受信は順番どおりに1件ずつ復号する。合言葉が違う・改ざん・使い回し・古いデータは捨てる
  const receive = async (cid, buf) => {
    if (!buf || !buf.length || buf.length > 40000) return;   // 空のデータ（合言葉なしで誰でも送れる）は無視する
    let env;
    try { env = await openJson(key, new TextDecoder().decode(buf), aadOf(cid)); } catch (e) { return; }
    if (!env || typeof env !== 'object' || typeof env.s !== 'string' || !Number.isFinite(env.q)) return;
    const last = seen.get(cid);
    if (env.gone) {
      if (last && last.s === env.s && peers.delete(cid)) notify();   // いまの接続の「退出」だけを受けつける
      return;
    }
    if (last && env.q <= last.q) return;
    const pres = env.d;
    if (!pres || typeof pres !== 'object' || Array.isArray(pres)) return;
    seen.set(cid, { s: env.s, q: env.q });
    peers.set(cid, { heard: Date.now(), obj: toPeer(cid, Object.freeze(pres)) });
    notify();
  };
  client.on('message', (topic, buf) => {
    const cid = topic.slice(base.length + 1);
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(cid) || cid === me) return;
    recvChain = recvChain.then(() => receive(cid, buf)).catch(() => {});
  });
  // 送信も順番どおりに。最新の自分の状態を暗号化して出す
  const send = env => {
    pubChain = pubChain.then(async () => {
      if (!client.connected) return;
      const payload = await sealJson(key, env, aadOf(me));
      client.publish(myTopic, payload, { retain: true, qos: 0 });
    }).catch(e => console.warn('publish', e));
    return pubChain;
  };
  const publish = () => { pubTimer = null; if (!closed) send({ s: session, q: nextSeq(), d: mine }); };
  client.on('connect', publish);   // 再接続したら自分の状態を出しなおす
  await new Promise((resolve, reject) => client.subscribe(`${base}/+`, { qos: 0 }, e => (e ? reject(e) : resolve())));
  // 生存確認：30秒ごとに自分の状態を出しなおし、150秒音沙汰のない人はいないものとする
  const hb = setInterval(() => {
    if (Object.keys(mine).length) publish();
    const now = Date.now(); let changed = false;
    for (const [cid, p] of peers) if (now - p.heard > 150000) { peers.delete(cid); changed = true; }
    if (changed) notify();
  }, 30000);
  const leave = async () => {
    if (closed) return;
    closed = true; clearInterval(hb);
    await Promise.race([send({ s: session, q: nextSeq(), gone: 1 }), new Promise(r => setTimeout(r, 400))]);
    try { client.end(); } catch (e) { /* noop */ }
  };
  window.addEventListener('pagehide', () => { leave(); });
  notify();
  return {
    kind: 'mqtt',
    presence(patch) {
      const next = { ...mine };
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      mine = JSON.parse(JSON.stringify(next));
      if (!pubTimer) pubTimer = setTimeout(publish, 40);
      notify();
      return Promise.resolve();
    },
    peers: () => snap,
    onPeers(h) { handlers.add(h); setTimeout(() => h({ peers: snap, joined: snap, left: [], updated: [] }), 0); return () => handlers.delete(h); },
    connected: () => client.connected,
    leave,
  };
}

function cleanNick(s) {
  return String(s ?? '').replace(/[\u0000-\u001f\u007f-\u009f<>&"'`\u200b-\u200f\u2028-\u202e\u2066-\u2069]/g, '').trim().slice(0, 10) || 'ゲスト';
}
function rememberRoom(obj) { try { obj ? sessionStorage.setItem('chuka-room', JSON.stringify(obj)) : sessionStorage.removeItem('chuka-room'); } catch (e) { /* noop */ } }
function rememberedRoom() { try { return JSON.parse(sessionStorage.getItem('chuka-room') || 'null'); } catch (e) { return null; } }

/* ---------- 状態のエンコード ---------- */
// 訪れた町の一覧は「ビットの列」を6ビットずつ文字にして送る（118駅で20文字）
function maskEncode(ids) {
  const bits = new Uint8Array(Math.ceil((STATIONS.length + 1) / 6) * 6);
  for (const id of ids) if (id > 0 && id < bits.length) bits[id] = 1;
  let out = '';
  for (let i = 0; i < bits.length; i += 6) out += ID64[bits[i] | bits[i + 1] << 1 | bits[i + 2] << 2 | bits[i + 3] << 3 | bits[i + 4] << 4 | bits[i + 5] << 5];
  return out.replace(/A+$/, '');
}
function maskDecode(str) {
  const out = [];
  [...String(str || '')].slice(0, 30).forEach((c, k) => { const v = ID64.indexOf(c); if (v < 0) return; for (let b = 0; b < 6; b++) if (v >> b & 1) { const id = k * 6 + b; if (Board.stById[id]) out.push(id); } });
  return out;
}
function encodeState(g) {
  return {
    y: g.year, m: g.month, t: g.turn, yr: g.years, d: g.dest, dd: g.destDist, b: g.bear ?? -1, ov: g.over ? 1 : 0, sd: g.started ? 1 : 0,
    o: PROP_KEYS.map(k => (g.owners[k] === undefined ? '-' : String(g.owners[k]))).join(''),
    ps: g.players.map(p => [p.money, p.pos, p.cards.map(c => CARD_CODE[c]).join(''), maskEncode(p.stamps), p.slow ? 1 : 0, p.arrivals || 0, p.skip ? 1 : 0]),
  };
}
function decodeState(s, seats) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.ps) || s.ps.length < 2 || s.ps.length > MAX_PLAYERS) return null;
  const n = s.ps.length;
  if (!isInt(s.y, 1, 10) || !isInt(s.m, 1, 12) || !isInt(s.t, 0, n - 1) || !isInt(s.yr, 1, 10)) return null;
  const nodes = Board.nodes.length;
  const g = {
    v: 1, years: s.yr, year: s.y, month: s.m, turn: s.t, started: !!s.sd, over: !!s.ov,
    dest: isInt(s.d, 1, STATIONS.length) && Board.stById[s.d] ? s.d : null, destDist: isInt(s.dd, 0, 999) ? s.dd : 0,
    bear: isInt(s.b, 0, n - 1) ? s.b : null, owners: {}, players: [],
  };
  const o = typeof s.o === 'string' ? s.o : '';
  PROP_KEYS.forEach((k, i) => { const c = o[i]; if (c >= '0' && c <= String(n - 1)) g.owners[k] = +c; });
  for (let i = 0; i < n; i++) {
    const a = s.ps[i];
    if (!Array.isArray(a) || !Number.isFinite(a[0]) || !isInt(a[1], 0, nodes - 1)) return null;
    const cards = [...String(a[2] || '')].map(c => CODE_CARD[c]).filter(Boolean).slice(0, MAX_CARDS);
    g.players.push({ idx: i, human: !!seats[i], remote: false, money: Math.round(a[0]), pos: a[1], cards, stamps: maskDecode(a[3]), slow: a[4] ? 1 : 0, arrivals: isInt(a[5], 0, 999) ? a[5] : 0, skip: a[6] ? 1 : 0 });
  }
  return g;
}

/* ---------- ホスト ---------- */
function hostPresence() {
  const base = {
    v: NET_V, role: 'host', code: Net.code, cid: Net.cid, nick: Net.nick, yr: Net.years, np: Net.np, sp: Net.speed, go: Net.started ? 1 : 0,
    seats: Net.seats.map(s => (s ? [s.cid, s.nick] : 0)), pr: Net.prompt,
  };
  if (Net.started && G) { base.st = encodeState(G); base.sn = Net.seq; }
  const enc = new TextEncoder();
  let ev = Net.log.slice(-16);
  for (;;) {
    const obj = { ...base, ev };
    if (enc.encode(JSON.stringify(obj)).length <= 3800 || !ev.length) return obj;
    ev = ev.slice(1);
  }
}
function hostPush() {
  if (Net.mode !== 'host' || !Net.room) return;
  Net.room.presence(hostPresence()).catch(e => console.warn('presence', e && e.code));
}
// 演出イベントをゲストへ（ホストのときだけ）
function netEv(ev) {
  if (Net.mode !== 'host' || !Net.started) return;
  ev.n = ++Net.seq;
  Net.log.push(ev);
  if (Net.log.length > 40) Net.log.shift();
  hostPush();
}

async function netCreate(nick, pass) {
  const t = await netApi();
  if (!t) throw new Error('unavailable');
  let code = '', room = null;
  for (let tries = 0; tries < 5; tries++) {
    code = String(1000 + Math.floor(Math.random() * 9000));
    room = await t.open(code, pass);
    if (t.kind !== 'mqtt') break;
    await new Promise(r => setTimeout(r, 1500));   // 同じ番号の部屋がすでにないか確かめる
    const taken = room.peers().some(p => !p.isMe && p.presence && p.presence.role === 'host' && p.presence.code === code);
    if (!taken) break;
    await room.leave(); room = null;
  }
  if (!room) throw new Error('no-room');
  Object.assign(Net, {
    mode: 'host', room, code, nick: cleanNick(nick),
    seats: [{ cid: Net.cid, nick: cleanNick(nick) }, ...Array(MAX_PLAYERS - 1).fill(null)], mySeat: 0, started: false, seq: 0, log: [], prompt: null,
  });
  rememberRoom(null);
  Net.pass = pass;
  room.onPeers(hostOnPeers);
  hostPush();
}

function hostOnPeers(ch) {
  if (Net.mode !== 'host') return;
  let changed = false;
  const present = new Set([Net.cid]);
  for (const peer of ch.peers) {
    if (peer.isMe && peer.sameTab) continue;
    const pr = peer.presence || {};
    if (pr.v !== NET_V || pr.role !== 'guest' || pr.code !== Net.code || typeof pr.cid !== 'string') continue;
    const cid = pr.cid.slice(0, 24);
    present.add(cid);
    const nick = cleanNick(pr.nick);
    let seat = Net.seats.findIndex(s => s && s.cid === cid);
    if (seat >= 0 && Net.seats[seat].nick !== nick) { Net.seats[seat].nick = nick; changed = true; }
    if (!Net.started) {
      const want = isInt(pr.want, -1, Net.np - 1) ? pr.want : -1;
      if (want >= 0 && want !== seat && !Net.seats[want]) { if (seat >= 0) Net.seats[seat] = null; Net.seats[want] = { cid, nick }; seat = want; changed = true; }
      else if (want === -1 && seat >= 0) { Net.seats[seat] = null; changed = true; }
    }
    const ans = pr.ans;
    if (Net.waiter && Net.prompt && ans && typeof ans === 'object' && ans.n === Net.prompt.n) {
      const s = Net.seats[Net.prompt.s];
      if (s && s.cid === cid) Net.waiter(ans);
    }
  }
  if (!Net.started) Net.seats.forEach((s, i) => { if (s && !present.has(s.cid)) { Net.seats[i] = null; changed = true; } });
  Net.seats.forEach(s => { if (!s) return; if (present.has(s.cid)) delete Net.absentSince[s.cid]; else Net.absentSince[s.cid] = Net.absentSince[s.cid] || Date.now(); });
  const before = [...Net.present].sort().join(), after = [...present].sort().join();
  Net.present = present;
  if (changed) hostPush();
  if (changed || before !== after) { if (typeof renderLobby === 'function') renderLobby(); if (G && typeof refresh === 'function' && Net.started) refresh(); }
}

// ゲストに判断をたずねる。答えがない・席に人がいない時間が続くと null（CPUが代わりに判断）
function netAsk(seat, prompt, timeoutMs = 90000) {
  const gone = () => { const s = Net.seats[seat]; const since = s ? Net.absentSince[s.cid] : Date.now() - 1e6; return !s || (since && Date.now() - since > 20000); };
  if (gone()) return Promise.resolve(null);
  return new Promise(resolve => {
    Net.prompt = { n: ++Net.pn, s: seat, ...prompt };
    let done = false;
    const t0 = Date.now();
    const finish = v => { if (done) return; done = true; clearInterval(iv); Net.waiter = null; Net.prompt = null; hostPush(); resolve(v); };
    Net.waiter = ans => finish(ans);
    const iv = setInterval(() => { if (gone() || Date.now() - t0 > timeoutMs) finish(null); }, 1000);
    hostPush();
  });
}

/* ---------- ゲスト ---------- */
function guestPush(extra = {}) {
  if (!Net.room) return;
  Net.room.presence({ v: NET_V, role: 'guest', code: Net.code, cid: Net.cid, nick: Net.nick, want: Net.want, ...extra }).catch(e => console.warn('presence', e && e.code));
}
async function netJoin(code, nick, pass) {
  const t = await netApi();
  if (!t) throw new Error('unavailable');
  const room = await t.open(code, pass);
  Object.assign(Net, { mode: 'guest', room, code, pass, nick: cleanNick(nick), want: -1, hostP: null, hostSeen: false, queue: [], lastQueued: 0, lastPlayed: 0, answeredN: 0 });
  rememberRoom({ code, nick: Net.nick, pass });
  guestPush();
  room.onPeers(guestOnPeers);
  setTimeout(() => { if (Net.mode === 'guest' && !Net.hostSeen && typeof lobbyError === 'function') lobbyError(`部屋 ${code} が見つかりません。部屋番号と合言葉を確かめてね。`); }, 9000);
}
function guestOnPeers(ch) {
  if (Net.mode !== 'guest') return;
  Net.present = new Set(ch.peers.map(p => p.presence && p.presence.cid).filter(Boolean));
  const host = ch.peers.find(p => !(p.isMe && p.sameTab) && p.presence && p.presence.v === NET_V && p.presence.role === 'host' && p.presence.code === Net.code);
  if (!host) {
    if (Net.hostSeen && !Net.hostGoneTimer) Net.hostGoneTimer = setTimeout(() => { if (typeof hostGone === 'function') hostGone(); }, 8000);
    return;
  }
  clearTimeout(Net.hostGoneTimer); Net.hostGoneTimer = null;
  Net.hostSeen = true;
  if (host.presence === Net.hostP) { if (typeof renderLobby === 'function') renderLobby(); return; }
  Net.hostP = host.presence;
  guestHandleHost(host.presence);
}
function parseSeats(arr) {
  return PLAYER_DEFS.map((_, i) => {
    const s = Array.isArray(arr) ? arr[i] : 0;
    return Array.isArray(s) && typeof s[0] === 'string' ? { cid: s[0].slice(0, 24), nick: cleanNick(s[1]) } : null;
  });
}
function guestHandleHost(hp) {
  Net.seats = parseSeats(hp.seats);
  Net.mySeat = Net.seats.findIndex(s => s && s.cid === Net.cid);
  Net.years = isInt(hp.yr, 1, 10) ? hp.yr : 3;
  Net.np = isInt(hp.np, 2, MAX_PLAYERS) ? hp.np : 4;
  Net.speed = hp.sp === 'fast' ? 'fast' : 'normal';
  if (!hp.go) {
    if (Net.want === -1 && Net.mySeat === -1 && !Net.autoSat) {
      const free = Net.seats.findIndex((s, i) => !s && i < Net.np);
      if (free >= 0) { Net.autoSat = true; Net.want = free; guestPush(); }
    }
    if (typeof renderLobby === 'function') renderLobby();
    return;
  }
  if (!Net.started) {
    const g = decodeState(hp.st, Net.seats);
    if (!g) return;
    Net.started = true;
    G = g;
    Net.lastQueued = Net.lastPlayed = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
    Net.latest = hp;
    enterOnlineGame();
    guestPump();
    return;
  }
  let added = false;
  for (const ev of Array.isArray(hp.ev) ? hp.ev : []) {
    if (ev && typeof ev === 'object' && isInt(ev.n, 1, 1e9) && EV_TYPES.has(ev.t) && ev.n > Net.lastQueued) { Net.queue.push(ev); Net.lastQueued = ev.n; added = true; }
  }
  const sn = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
  if (sn > Net.lastQueued) Net.lastQueued = sn;   // 取りこぼしたイベントは状態の同期で補う
  Net.latest = hp;
  if (added && Net.skip) Net.skip();   // ホストが先に進んだら表示中のメッセージを閉じる
  guestPump();
}

async function guestPump() {
  if (Net.playing) return;
  Net.playing = true;
  try {
    for (;;) {
      while (Net.queue.length) {
        const ev = Net.queue.shift();
        try { await playEv(ev, Net.queue.length > 3); } catch (e) { console.error(e); }
        Net.lastPlayed = ev.n;
      }
      if (Net.lastPlayed < Net.lastQueued) Net.lastPlayed = Net.lastQueued;
      applyLatest();
      if (!Net.queue.length) break;
    }
  } finally { Net.playing = false; }
}
function applyLatest() {
  const hp = Net.latest;
  if (!hp || !hp.st) return;
  const sn = isInt(hp.sn, 0, 1e9) ? hp.sn : 0;
  if (sn > Net.lastPlayed) return;
  const g = decodeState(hp.st, Net.seats);
  if (g) { G = g; refresh(); }
  if (G && G.over) { if (!Net.finalShown) { Net.finalShown = true; showFinal(); } return; }
  guestPrompt(hp.pr);
}
function guestAnswer(pr, data) {
  if (Net.activePrompt !== pr) return;
  Net.answeredN = pr.n; Net.activePrompt = null;
  guestPush({ ans: { n: pr.n, ...data } });
}

/* 中国大陸すごろく — 立体のボンビーキョンシー
   three.js でキョンシーを3Dで組み立て、ぴょんぴょん跳ねるアニメーションの画像を用意する。
   地図の上やメッセージではその画像を順番に切りかえて動かす（毎フレーム3D描画しないので軽い）。
   three.js が読めないときは、平面の絵のまま遊べる。 */

const THREE_SRC = ['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', 'https://unpkg.com/three@0.128.0/build/three.min.js'];
const THREE_SRI = 'sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu';
const BOMBEE_PX = 220;   // キョンシーの画像の大きさ
const BOMBEE_FRAMES = 12;
const Sprites = { ready: false, bombee: [], frame: 0 };

async function loadThree() {
  if (window.THREE) return;
  for (const src of THREE_SRC) { try { await loadScript(src, THREE_SRI); if (window.THREE) return; } catch (e) { /* 次を試す */ } }
  throw new Error('three-load');
}

async function initSprites(onReady) {
  try {
    await loadThree();
    await new Promise(r => setTimeout(r, 30));
    buildSprites();
    Sprites.ready = true;
    setInterval(() => { Sprites.frame = (Sprites.frame + 1) % BOMBEE_FRAMES; tickBombee(); }, 90);
    onReady && onReady();
  } catch (e) { console.warn('3D表示なしで続けます', e); }
}

/* ---------- 部品づくりの道具 ---------- */
function makeKit(T) {
  const plain = (hex, rough = 0.7) => new T.MeshStandardMaterial({ color: hex, roughness: rough });
  const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
  const box = (w, h, d, material, x, y, z) => { const m = shadowed(new T.Mesh(new T.BoxGeometry(w, h, d), material)); m.position.set(x, y, z); return m; };
  const ball = (r, material, x, y, z, sx = 1, sy = 1, sz = 1) => { const m = shadowed(new T.Mesh(new T.SphereGeometry(r, 24, 16), material)); m.position.set(x, y, z); m.scale.set(sx, sy, sz); return m; };
  const cyl = (rt, rb, h, material, x, y, z, seg = 24) => { const m = shadowed(new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), material)); m.position.set(x, y, z); return m; };
  return { plain, box, ball, cyl };
}

/* ---------- ボンビーキョンシー ---------- */
function buildKyonshi(T, K) {
  const robe = K.plain(0x3b3a8a, 0.8), trim = K.plain(0xf2c230, 0.5), skin = K.plain(0xcfe5c6, 0.85), ink = K.plain(0x141010, 0.3), hatM = K.plain(0x26262e, 0.6);
  const g = new T.Group(), body = new T.Group(), head = new T.Group(), arms = new T.Group(), paper = new T.Group();
  g.add(body);
  body.add(K.cyl(0.62, 0.95, 1.9, robe, 0, 1.1, 0));
  body.add(K.cyl(0.97, 0.97, 0.12, trim, 0, 0.18, 0));
  body.add(K.box(0.14, 1.7, 0.05, trim, 0, 1.15, 0.72));
  for (const s of [-1, 1]) body.add(K.box(0.36, 0.2, 0.6, K.plain(0x1a1a1a, 0.5), s * 0.36, 0.1, 0.25));
  arms.position.set(0, 1.82, 0.1);
  for (const s of [-1, 1]) {
    const a = K.cyl(0.2, 0.24, 1.5, robe, s * 0.62, 0, 0.7); a.rotation.x = Math.PI / 2; arms.add(a);
    arms.add(K.ball(0.16, skin, s * 0.62, -0.02, 1.5, 0.9, 0.6, 1.1));
    const cuff = K.cyl(0.25, 0.25, 0.1, trim, s * 0.62, 0, 1.42); cuff.rotation.x = Math.PI / 2; arms.add(cuff);
  }
  body.add(arms);
  head.position.set(0, 2.55, 0.05); body.add(head);
  head.add(K.ball(0.62, skin, 0, 0, 0, 1, 1.08, 0.95));
  head.add(K.cyl(0.66, 0.7, 0.42, hatM, 0, 0.6, 0));
  head.add(K.cyl(0.86, 0.86, 0.1, hatM, 0, 0.42, 0));
  head.add(K.ball(0.14, K.plain(0xe0302f, 0.35), 0, 0.92, 0));
  for (const s of [-1, 1]) {
    const eye = K.box(0.24, 0.05, 0.05, ink, s * 0.24, 0.0, 0.58); eye.rotation.z = s * -0.15; head.add(eye);
    head.add(K.ball(0.13, K.plain(0x94b08c, 0.9), s * 0.25, -0.07, 0.54, 1.1, 0.7, 0.3));
  }
  const mouth = new T.Mesh(new T.TorusGeometry(0.14, 0.025, 8, 16, Math.PI), ink); mouth.position.set(0, -0.32, 0.56); mouth.rotation.z = Math.PI; head.add(mouth);
  for (const s of [-1, 1]) { const f = K.box(0.04, 0.08, 0.03, K.plain(0xffffff, 0.3), s * 0.07, -0.34, 0.6); head.add(f); }
  paper.position.set(0, 0.18, 0.62);
  paper.add(K.box(0.3, 0.72, 0.02, K.plain(0xf6d64a, 0.7), 0, -0.2, 0));
  for (let i = 0; i < 4; i++) paper.add(K.box(0.18, 0.03, 0.025, K.plain(0xd4141c, 0.5), 0, -0.02 - i * 0.14, 0.01));
  head.add(paper);
  return { g, body, head, arms, paper };
}

/* ---------- 画像を描く ---------- */
function buildSprites() {
  const T = THREE, K = makeKit(T);
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  scene.add(new T.HemisphereLight(0xffffff, 0x6f7f99, 0.9));
  const sun = new T.DirectionalLight(0xffffff, 0.85);
  sun.position.set(-4, 10, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(sun);
  const ground = new T.Mesh(new T.PlaneGeometry(16, 16), new T.ShadowMaterial({ opacity: 0.3 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // キョンシー：ぴょんぴょん跳ねて、お札がひらひらするアニメーション
  renderer.setSize(BOMBEE_PX, BOMBEE_PX);
  const bcam = new T.PerspectiveCamera(30, 1, 0.1, 100);
  bcam.position.set(2.4, 3.6, 8.2); bcam.lookAt(0, 1.9, 0);
  const k = buildKyonshi(T, K);
  scene.add(k.g);
  for (let f = 0; f < BOMBEE_FRAMES; f++) {
    const t = f / BOMBEE_FRAMES * Math.PI * 2;
    k.body.position.y = 0.35 * Math.abs(Math.sin(t));
    k.g.rotation.y = 0.35 + 0.15 * Math.sin(t);
    k.head.rotation.z = 0.08 * Math.sin(t * 2);
    k.arms.rotation.x = -0.08 + 0.08 * Math.sin(t * 2);
    k.paper.rotation.x = -0.25 - 0.35 * Math.abs(Math.sin(t));
    renderer.render(scene, bcam);
    Sprites.bombee.push(renderer.domElement.toDataURL('image/png'));
  }
  scene.remove(k.g);
  renderer.dispose();
  renderer.forceContextLoss && renderer.forceContextLoss();
}

function tickBombee() {
  const src = Sprites.bombee[Sprites.frame];
  document.querySelectorAll('img.bombee3d').forEach(el => { el.src = src; });
}
// キョンシーのアイコン（3Dがまだ・使えないときは平面の絵）
function bombeeImg(size) {
  return Sprites.ready
    ? `<img class="bombee3d" src="${Sprites.bombee[Sprites.frame]}" width="${size}" height="${size}" alt="" draggable="false">`
    : KYONSHI_SVG(size);
}

/* 中国大陸すごろく — カメラと操作パネル
   プレイ中は本家（桃鉄）のように、盤面を斜めにたおした「プレイヤー視点」で手番の社長に寄って見せる。
   - 地面（#ground）：画面に見えている範囲だけを CSS の rotateX でたおす（盤面全体をたおすと、拡大したときに
     カメラの後ろにはみ出した部分をブラウザが描けなくなり、線路やマスが消えることがあるため）。
     その中の #stage（背景・線路・マス）は2Dで動かすだけ。
   - 看板・名所・コマ（#bbov の .bb）：地面の点を画面の座標に計算して、普通の2Dで重ねる（立って見える）。
   - カメラの動きは requestAnimationFrame で1か所にまとめて描く（カクつきをおさえる）。
   「全体マップ」は真上から。プレイヤー視点でもズームアウトすると、だんだん真上からの視点になる。
   画面が小さいとき（スマホ）は body.compact にして、操作パネルを小さくまとめる。 */

const TILT = 50;   // プレイヤー視点で盤面をたおす角度（度）
const Cam = { fx: 1800, fy: 1300, s: 0.4, t: 0, user: false, overview: true };   // めざすカメラ
const View = { fx: 1800, fy: 1300, s: 0.4, t: 0 };                                   // いま描いているカメラ
let compact = false;
const MAP_BOUNDS = (() => {
  const pts = [...GEO.china, ...GEO.taiwan, ...GEO.hainan];
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x0: Math.min(...xs) - 110, y0: Math.min(...ys) - 90, x1: Math.max(...xs) + 140, y1: Math.max(...ys) + 110 };
})();

const isCompactSize = (vw, vh) => vw < 820 || vh < 540;

function setCompact(on) {
  compact = on;
  document.body.classList.toggle('compact', on);
}

function hudInsets() {
  const t = document.getElementById('hud-top'), b = document.getElementById('hud-bottom');
  return { top: t ? t.getBoundingClientRect().height : 0, bottom: b ? b.getBoundingClientRect().height : 0 };
}
function syncHudVars() {
  const { top, bottom } = hudInsets();
  document.body.style.setProperty('--hud-t', `${Math.round(top)}px`);
  document.body.style.setProperty('--hud-b', `${Math.round(bottom)}px`);
  Proj.dirty = true;
}
function camArea() {
  const { top, bottom } = hudInsets();
  return { x: 0, y: top, w: window.innerWidth, h: Math.max(120, window.innerHeight - top - bottom) };
}
// 画面の大きさから決まる値（HUDの大きさを毎回はからないように覚えておく）
const Proj = { dirty: true, A: null, ax: 0, ay: 0, d: 800, W: 0, H: 0 };
function projInfo() {
  if (Proj.dirty || Proj.W !== window.innerWidth || Proj.H !== window.innerHeight) {
    const A = camArea();
    Object.assign(Proj, { dirty: false, A, ax: A.x + A.w / 2, ay: A.y + A.h * 0.56, d: Math.max(760, window.innerHeight * 1.1), W: window.innerWidth, H: window.innerHeight });
  }
  return Proj;
}
function camAnchor() { const P = projInfo(); return [P.ax, P.ay]; }
function fitScale() {
  const A = projInfo().A;
  return Math.min(A.w / (MAP_BOUNDS.x1 - MAP_BOUNDS.x0), A.h / (MAP_BOUNDS.y1 - MAP_BOUNDS.y0));
}
function camLimits() { return { min: fitScale(), max: compact ? 2.4 : 2.0 }; }
const camPlayZoom = () => {
  const A = projInfo().A;
  return compact ? Math.min(A.w / 300, A.h / 400) : Math.max(0.85, Math.min(1.8, A.w / 860, A.h / 470));
};
// プレイヤー視点の傾き：ふつうの大きさでは TILT、全体が見えるくらいまでズームアウトすると0（真上から）
function tiltFor(s) {
  if (Cam.overview) return 0;
  const lo = fitScale() * 1.3, hi = Math.max(lo + 0.05, camPlayZoom() * 0.72);
  const k = Math.min(1, Math.max(0, (s - lo) / (hi - lo)));
  return TILT * k * k * (3 - 2 * k);
}

// 地図の座標 → 画面の座標と、その場所での大きさの倍率（CSS の perspective・rotateX と同じ計算）
function projectPt(x, y, V = Cam) {
  const P = projInfo(), t = V.t * Math.PI / 180;
  const X = V.s * (x - V.fx), Y = V.s * (y - V.fy);
  const den = P.d - Y * Math.sin(t);
  if (den <= 1) return null;
  const f = P.d / den;
  return [P.ax + X * f, P.ay + Y * Math.cos(t) * f, f];
}
function worldToScreen(x, y, V = Cam) { const r = projectPt(x, y, V); return r ? [r[0], r[1]] : [NaN, NaN]; }
// 画面の座標 → 地図の座標（地平線より上なら null）
function screenToWorld(sx, sy, V = Cam) {
  const P = projInfo(), t = V.t * Math.PI / 180;
  const v = sy - P.ay, c = Math.cos(t), sn = Math.sin(t);
  const den = P.d * c + v * sn;
  if (den <= 1e-3) return null;
  const Y = v * P.d / den;
  const f = P.d / (P.d - Y * sn);
  return [V.fx + (sx - P.ax) / f / V.s, V.fy + Y / V.s];
}

/* ---- 描画（地面と、立てて見せるもの） ---- */
const BB = [];   // 立てて見せるもの { el, x, y, z }
function addBillboard(el, x, y, zb = 0) {
  const b = { el, x, y, zb, z: null, hid: false, tw: null };
  el._bb = b; BB.push(b);
  document.getElementById('bbov').appendChild(el);
  return b;
}
function removeBillboard(el) { const i = BB.indexOf(el._bb); if (i >= 0) BB.splice(i, 1); el.remove(); }
// 立てて見せるものを動かす（ms をわたすと、その時間でなめらかに）
function moveBillboard(el, x, y, ms = 0) {
  const b = el._bb; if (!b) return;
  if (ms > 0) { b.tw = { x0: b.x, y0: b.y, x1: x, y1: y, t0: performance.now(), ms }; kick(ms); }
  else { b.tw = null; b.x = x; b.y = y; kick(0); }
}
let groundBox = '';
function renderGround() {
  const P = projInfo(), V = View, t = V.t * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t), d = P.d;
  // 地面のうち、画面に見えている範囲（カメラより手前には出ない）
  const vb = P.H - P.ay + 40;
  const GN = vb * d / (d * c + vb * sn) + 60;
  const vt = P.ay + 60, denT = d * c - vt * sn;
  const GF = denT > 40 ? Math.min(7000, vt * d / denT + 60) : 7000;
  const GW = Math.min(12000, (P.W / 2 + 60) * (d + GF * sn) / d);
  const g = document.getElementById('ground'), st = document.getElementById('stage');
  const box = `${Math.round(GW)},${Math.round(GF)},${Math.round(GN)}`;
  if (box !== groundBox) { groundBox = box; g.style.width = `${Math.round(GW * 2)}px`; g.style.height = `${Math.round(GF + GN)}px`; }
  g.style.transform = `translate3d(${P.ax.toFixed(1)}px, ${P.ay.toFixed(1)}px, 0) rotateX(${V.t.toFixed(2)}deg) translate(${-Math.round(GW)}px, ${-Math.round(GF)}px)`;
  st.style.transform = `translate(${Math.round(GW)}px, ${Math.round(GF)}px) scale(${V.s.toFixed(4)}) translate(${(-V.fx).toFixed(1)}px, ${(-V.fy).toFixed(1)}px)`;
  const vp = document.getElementById('viewport');
  vp.style.perspective = `${d}px`;
  vp.style.perspectiveOrigin = `${P.ax.toFixed(1)}px ${P.ay.toFixed(1)}px`;
}
function renderBillboards() {
  const P = projInfo(), mx = 260;
  for (const b of BB) {
    const r = projectPt(b.x, b.y, View);
    if (!r || r[0] < -mx || r[0] > P.W + mx || r[1] < -mx || r[1] > P.H + mx * 1.5) {
      if (!b.hid) { b.el.style.display = 'none'; b.hid = true; }
      continue;
    }
    if (b.hid) { b.el.style.display = ''; b.hid = false; }
    b.el.style.transform = `translate(${r[0].toFixed(1)}px, ${r[1].toFixed(1)}px) scale(${(View.s * r[2]).toFixed(3)})`;
    const z = Math.round(b.y) + b.zb + 10;
    if (z !== b.z) { b.z = z; b.el.style.zIndex = z; }
  }
}
// アニメーション：カメラの移動と、コマなどの移動を1か所でまとめて描く
let CamAnim = null, rafId = 0, snapT = 0, rasterS = 0, rasterT = 0;
const ease = k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
function kick(ms) {
  if (!rafId) rafId = requestAnimationFrame(frame);
  clearTimeout(snapT);
  snapT = setTimeout(() => frame(performance.now() + 1e7), Math.max(ms, CamAnim ? CamAnim.ms : 0) + 120);   // 画面が裏にあって描けないときは最後の形にする
}
function frame(now) {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  let busy = false;
  if (CamAnim) {
    const k = Math.min(1, (now - CamAnim.t0) / CamAnim.ms), e = ease(k), a = CamAnim.from, b = CamAnim.to;
    for (const key of ['fx', 'fy', 's', 't']) View[key] = a[key] + (b[key] - a[key]) * e;
    if (k < 1) busy = true; else { CamAnim = null; rerasterLater(); }
  }
  renderGround();
  for (const bb of BB) {
    if (!bb.tw) continue;
    const k = Math.min(1, (now - bb.tw.t0) / bb.tw.ms);
    bb.x = bb.tw.x0 + (bb.tw.x1 - bb.tw.x0) * k; bb.y = bb.tw.y0 + (bb.tw.y1 - bb.tw.y0) * k;
    if (k < 1) busy = true; else bb.tw = null;
  }
  renderBillboards();
  mmView();
  if (busy) rafId = requestAnimationFrame(frame);
  else clearTimeout(snapT);
}
// 拡大率が大きく変わったら、背景と線路をその大きさで描きなおしてもらう（ぼやけないように）
function rerasterLater() {
  clearTimeout(rasterT);
  rasterT = setTimeout(() => {
    if (CamAnim) return;
    if (rasterS && Math.abs(Math.log(View.s / rasterS)) < 0.25) return;
    rasterS = View.s;
    const st = document.getElementById('stage');
    st.style.willChange = 'auto';
    requestAnimationFrame(() => requestAnimationFrame(() => { st.style.willChange = 'transform'; }));
  }, 260);
}

function camApply(animate) {
  if (animate) {
    CamAnim = { from: { ...View }, to: { fx: Cam.fx, fy: Cam.fy, s: Cam.s, t: Cam.t }, t0: performance.now(), ms: Math.abs(Cam.t - View.t) > 8 ? 650 : 450 };
    kick(CamAnim.ms);
  } else {
    CamAnim = null;
    Object.assign(View, { fx: Cam.fx, fy: Cam.fy, s: Cam.s, t: Cam.t });
    frame(performance.now());
    rerasterLater();
  }
  document.body.classList.toggle('tilted', Cam.t > 1);
  const fit = document.getElementById('h-fit');
  if (fit) fit.textContent = !(G && G.started) ? '全体' : Cam.overview ? 'プレイヤー視点' : '全体マップ';
}
function camClamp() {
  const L = camLimits(), B = MAP_BOUNDS;
  Cam.s = Math.min(L.max, Math.max(L.min, Cam.s));
  Cam.t = tiltFor(Cam.s);
  const A = projInfo().A, [ax, ay] = camAnchor();
  if (Cam.t > 1) {   // 傾けているときは、手前と左右に盤の外があまり見えないようにする（奥は空が見えてよい）
    const hw = Math.min(WORLD_W / 2, A.w / 2 / Cam.s * 0.9), down = A.h * 0.44 / (Cam.s * Math.cos(Cam.t * Math.PI / 180)) * 0.85;
    Cam.fx = Math.min(WORLD_W - hw, Math.max(hw, Cam.fx));
    Cam.fy = Math.min(Math.max(B.y0 + 160, WORLD_H - down), Math.max(B.y0 + 160, Cam.fy));
    return;
  }
  const left = (ax - A.x) / Cam.s, right = (A.x + A.w - ax) / Cam.s, up = (ay - A.y) / Cam.s, down = (A.y + A.h - ay) / Cam.s;
  if (B.x1 - B.x0 <= left + right) Cam.fx = (B.x0 + B.x1) / 2;
  else Cam.fx = Math.min(B.x1 - right, Math.max(B.x0 + left, Cam.fx));
  if (B.y1 - B.y0 <= up + down) Cam.fy = (B.y0 + B.y1) / 2 + (up - down) / 2;
  else Cam.fy = Math.min(B.y1 - down, Math.max(B.y0 + up, Cam.fy));
}
// 全体マップ（真上から全体）
function camFit(animate = true) { Cam.overview = true; Cam.s = fitScale(); camClamp(); camApply(animate); }
function camCenter(x, y, s = Cam.s, animate = true) {
  Cam.s = s; Cam.fx = x; Cam.fy = y;
  camClamp(); camApply(animate);
}
const camZoomed = () => !Cam.overview || Cam.s > fitScale() * 1.08;
// プレイヤー視点にもどす
function camPlayerView(x, y, s = camPlayZoom()) { Cam.overview = false; camCenter(x, y, s, true); }

/* ---- ゲームの進行にあわせてカメラを動かす ---- */
function camOnTurn(p) {
  if (!G || !p) return;
  Cam.user = false;
  if (Cam.overview) { camFit(true); return; }   // 全体マップを見ているあいだは、真上からのまま
  const [x, y] = tokenXY(p);
  camPlayerView(x, y - 10);
}
function camOnPick(nodes) {
  if (!nodes.length) return;
  Cam.user = false;
  const xs = nodes.map(i => Board.nodes[i].x), ys = nodes.map(i => Board.nodes[i].y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const A = projInfo().A, pad = 90;
  if (Cam.overview) {
    const s = Math.min(A.w / (x1 - x0 + pad * 2), A.h / (y1 - y0 + pad * 2), camPlayZoom() * 1.2);
    camCenter((x0 + x1) / 2, (y0 + y1) / 2, Math.max(s, fitScale()));
    return;
  }
  const c = Math.cos(TILT * Math.PI / 180);
  const s = Math.min(A.w * 0.92 / (x1 - x0 + pad * 2), A.h * 0.78 / ((y1 - y0 + pad * 2) * c), camPlayZoom() * 1.05);
  camCenter((x0 + x1) / 2, (y0 + y1) / 2 + 20, Math.max(s, camPlayZoom() * 0.55));
}
function camFollow(x, y) {
  if (Cam.user) return;
  const A = projInfo().A;
  const [sx, sy] = worldToScreen(x, y);
  const mx = A.w * 0.2, my = A.h * 0.22;
  if (!(sx >= A.x + mx && sx <= A.x + A.w - mx && sy >= A.y + my && sy <= A.y + A.h - my)) camCenter(x, y, Cam.overview ? Math.max(Cam.s, fitScale() * 2.5) : Cam.s);
}
function camShowNode(i) {
  const n = Board.nodes[i];
  if (Cam.overview) camCenter(n.x, n.y, Math.max(Cam.s, fitScale() * 2.5));
  else camPlayerView(n.x, n.y, Math.max(Cam.s, camPlayZoom()));
}
function layoutCamera() {
  syncHudVars();
  groundBox = '';
  if (Cam.user || Cam.overview) { if (Cam.overview && !Cam.user) Cam.s = fitScale(); camClamp(); camApply(false); }
  else if (G && TOK[G.turn]) camOnTurn(P(G.turn));
  else camFit(false);
}

/* ---- マウス・指での操作 ---- */
function setupGestures() {
  const vp = document.getElementById('viewport');
  const onBoard = e => !e.target.closest('#hud > *, #overlay > *');
  const pts = new Map();
  let start = null, dragged = false, lastTap = 0, zoomEnd = 0;
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;
  // 画面の点 (px, py) の下にある地図の場所を動かさずに拡大縮小する
  const zoomAt = (px, py, s) => {
    const w0 = screenToWorld(px, py);
    const L = camLimits();
    Cam.s = Math.min(L.max, Math.max(L.min, s));
    Cam.t = tiltFor(Cam.s);
    const w1 = screenToWorld(px, py);
    if (w0 && w1) { Cam.fx += w0[0] - w1[0]; Cam.fy += w0[1] - w1[1]; }
    camClamp();
  };
  const panBy = (base, dx, dy) => {
    Cam.fx = base.fx - dx / Cam.s;
    Cam.fy = base.fy - dy / (Cam.s * Math.max(0.35, Math.cos(Cam.t * Math.PI / 180)));
  };
  vp.addEventListener('pointerdown', e => {
    if ((e.pointerType === 'mouse' && e.button !== 0) || !onBoard(e)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { start = { cam: { ...Cam }, p: { x: e.clientX, y: e.clientY } }; dragged = false; }
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; start = { cam: { ...Cam }, mid: mid(a, b), dist: dist(a, b) }; }
  });
  window.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !start) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1 && start.p) {
      const dx = e.clientX - start.p.x, dy = e.clientY - start.p.y;
      if (!dragged && Math.hypot(dx, dy) < 8) return;
      if (!dragged) vp.classList.add('dragging');
      dragged = true; Cam.user = true;
      panBy(start.cam, dx, dy);
      camClamp(); camApply(false);
    } else if (pts.size >= 2 && start.mid) {
      const [a, b] = [...pts.values()];
      const m = mid(a, b);
      Object.assign(Cam, { fx: start.cam.fx, fy: start.cam.fy, s: start.cam.s, t: start.cam.t });
      zoomAt(start.mid.x, start.mid.y, start.cam.s * dist(a, b) / start.dist);
      panBy({ fx: Cam.fx, fy: Cam.fy }, m.x - start.mid.x, m.y - start.mid.y);
      camClamp(); camApply(false);
      dragged = true; Cam.user = true;
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size === 1) { const [a] = [...pts.values()]; start = { cam: { ...Cam }, p: a }; }
    else if (!pts.size) {
      start = null;
      vp.classList.remove('dragging');
      if (!dragged && e.type === 'pointerup' && e.pointerType !== 'mouse') {
        const now = Date.now();
        if (now - lastTap < 300 && !e.target.closest('.hl-ring, .st, .sign')) {
          Cam.user = true;
          zoomAt(e.clientX, e.clientY, Cam.s * 1.5);
          camApply(true);
          lastTap = 0;
        } else lastTap = now;
      }
    }
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  // ドラッグしたあとの「クリック」は無視する（地図を動かしただけで町が開かないように）
  vp.addEventListener('click', e => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);
  vp.addEventListener('dblclick', e => { if (!onBoard(e)) return; Cam.user = true; zoomAt(e.clientX, e.clientY, Cam.s * 1.5); camApply(true); });
  vp.addEventListener('wheel', e => {
    if (!onBoard(e)) return;
    e.preventDefault();
    Cam.user = true;
    const f = e.ctrlKey ? Math.exp(-e.deltaY * 0.01) : (e.deltaY < 0 ? 1.12 : 1 / 1.12);
    zoomAt(e.clientX, e.clientY, Cam.s * f);
    camApply(false);
  }, { passive: false });
  // キーボード：矢印キーで移動、＋−で拡大縮小
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    const step = 140;
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (mv) { Cam.user = true; Cam.fx += mv[0] / Cam.s; Cam.fy += mv[1] / Cam.s; camClamp(); camApply(true); e.preventDefault(); return; }
    if (e.key === '+' || e.key === '=' || e.key === '-') {
      const [ax, ay] = camAnchor(); Cam.user = true;
      zoomAt(ax, ay, Cam.s * (e.key === '-' ? 1 / 1.25 : 1.25)); camApply(true);
    }
  });
}

/* ---- 全体図（ミニマップ） ---- */
const mmXY = (x, y) => [(x - MM.x0) * MM.sc + MM.ox, (y - MM.y0) * MM.sc + MM.oy];
function mmView() {
  if (typeof MM === 'undefined' || !MM) return;
  const A = projInfo().A;
  // 画面の4すみが地図のどこにあたるか（地平線より上は少し下げて求める）
  const at = (sx, sy) => { for (let k = 0; k < 12; k++) { const w = screenToWorld(sx, sy + k * A.h / 12, View); if (w) return w; } return [View.fx, View.fy]; };
  const corners = [at(A.x, A.y), at(A.x + A.w, A.y), screenToWorld(A.x + A.w, A.y + A.h, View) || [View.fx, View.fy], screenToWorld(A.x, A.y + A.h, View) || [View.fx, View.fy]];
  const v = document.getElementById('mm-view');
  if (v && corners.every(c => Number.isFinite(c[0]) && Number.isFinite(c[1]))) v.setAttribute('points', corners.map(([x, y]) => mmXY(x, y).map(n => n.toFixed(1)).join(',')).join(' '));
}
function setupMinimap() {
  const box = document.getElementById('hud-mini');
  box.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const svg = document.getElementById('mm-over'), r = svg.getBoundingClientRect();

    Cam.user = true;
    camCenter((px - MM.ox) / MM.sc + MM.x0, (py - MM.oy) / MM.sc + MM.y0, Math.max(Cam.s, Cam.overview ? fitScale() * 2.2 : camPlayZoom() * 0.8));
  });
}

/* 中国大陸すごろく — ゲーム本体 */

const SPEEDS = { normal: 1, fast: 0.45, turbo: 0.22 };
const spdName = () => (online() ? Net.speed : Settings.speed);
const spd = ms => Math.round(ms * (SPEEDS[spdName()] || 1));
const yf = () => 1 + 0.25 * (G.year - 1);
const r10 = v => Math.round(v / 10) * 10;
const r100 = v => Math.round(v / 100) * 100;
function fmt(m) {
  const neg = m < 0; m = Math.abs(Math.round(m));
  const oku = Math.floor(m / 10000), man = m % 10000;
  const s = oku ? `${oku}億${man ? man + '万' : ''}円` : `${man}万円`;
  return (neg ? '-' : '') + s;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// ホストから届いた文章は、太字・改行・色付き(minus/small)以外のタグを無効にして表示する
function safeHtml(s) {
  return esc(String(s ?? '').slice(0, 600)).replace(/&lt;(\/?b|br|\/span|span class=&quot;(?:minus|small)&quot;)&gt;/g, (m, tag) => '<' + tag.replace(/&quot;/g, '"') + '>');
}
const P = i => G.players[i];
const def = p => PLAYER_DEFS[p.idx];
const stOf = sid => Board.stById[sid];
const destNode = () => Board.stNode[G.dest];
const propKey = (sid, i) => `${sid}:${i}`;
const ownerOf = (sid, i) => (G ? G.owners[propKey(sid, i)] : undefined);
const isMono = (sid, pi) => stOf(sid).props.every((_, i) => ownerOf(sid, i) === pi);
function ownedProps(p) {
  const out = [];
  for (const s of STATIONS) s.props.forEach((pr, i) => { if (ownerOf(s.id, i) === p.idx) out.push({ sid: s.id, i, name: pr[0], price: pr[1], rate: pr[2], season: pr[3] || '' }); });
  return out;
}
const assets = p => p.money + ownedProps(p).reduce((a, o) => a + o.price, 0);
function yearlyIncome(p) {
  let sum = 0;
  for (const o of ownedProps(p)) sum += o.price * o.rate / 100 * (isMono(o.sid, p.idx) ? 2 : 1);
  return r10(sum);
}
// 'cpu' | 'local'（この画面の人） | 'remote'（オンラインの他の人）
const controller = p => (!p.human ? 'cpu' : p.remote ? 'remote' : 'local');
const seatNick = i => (online() && Net.seats[i] ? Net.seats[i].nick : '');

/* ================= 季節と地域 ================= */
const seasonNow = () => SEASON_OF(G.month);
function redMult(zone, s = seasonNow()) {
  if (s === 'h') return zone === 'south' ? 1 : 1.5;
  if (s === 'n') return zone === 'south' ? 1.8 : zone === 'north' ? 1.2 : 1;
  if (s === 'f') return zone === 'south' ? 1 : 2;
  return 1;
}
function blueMult(zone, s = seasonNow(), m = G.month) {
  if (m === 2) return 2;
  if (s === 'n') return 1.2;
  if (s === 'a') return 1.4;
  if (s === 'f') return zone === 'south' ? 1.5 : 0.8;
  return 1;
}
const airCanceled = (zone, s = seasonNow()) => (s === 'n' && zone === 'south') || (s === 'f' && zone !== 'south');
const portCanceled = (zone, s = seasonNow()) => (s === 'n' && zone === 'south') || (s === 'f' && zone === 'north');
const railFull = (m = G.month) => m === 1 || m === 2;
const SEASON_SUMMARY = {
  h: '北と西は黄砂で赤マス1.5倍・！マスは砂嵐・旬マスは茶と花が主役',
  n: '南は台風！赤マス1.8倍・空港と港は欠航／高鉄マスはサイコロ2個',
  a: '国慶節と実りの秋！青マス1.4倍・パンダの赤ちゃんが生まれる季節',
  f: '北と西は大雪！赤マス2倍・！マスで1回休み・空港は欠航／黄マスはカード2枚',
};

/* ================= 画面の大きさ ================= */
let paintedK = 0, paintedSeason = '';
function onResize() {
  const want = isCompactSize(window.innerWidth, window.innerHeight);
  if (want !== compact) { setCompact(want); if (G) refresh(); }
  layoutCamera();
}
function paintIfNeeded() {
  const dpr = window.devicePixelRatio || 1;
  const maxK = Math.sqrt(15.5e6 / (WORLD_W * WORLD_H));   // 背景の画像は約1500万画素まで（スマホの上限）
  const k = Math.min(maxK, compact ? 1 : Math.max(1, dpr * 0.7));
  if (k <= paintedK + 0.05) return;
  paintedK = k;
  paintBackground($('#bg'), k);
}
function paintSeasonIfNeeded() {
  const s = G ? seasonNow() : 'h';
  if (s === paintedSeason) return;
  paintedSeason = s;
  paintSeasonLayer($('#season'), s);
  renderSeasonMarks();
}
// 季節で効果が変わったマスに印をつける（雪・台風・黄砂・欠航・満員）
function renderSeasonMarks() {
  const g = UI.gSeason; if (!g) return;
  if (!G) { g.innerHTML = ''; return; }
  const s = seasonNow();
  let h = '';
  for (const n of Board.nodes) {
    if (n.kind !== 'sq') continue;
    let mk = null;
    if (n.type === 'red' && redMult(n.zone, s) > 1) mk = s === 'f' ? 'snow' : s === 'h' ? 'sand' : n.zone === 'south' ? 'typhoon' : 'rain';
    else if (n.type === 'hap' && s === 'f' && n.zone !== 'south') mk = 'snow';
    else if (n.type === 'air' && airCanceled(n.zone, s)) mk = 'x';
    else if (n.type === 'port' && portCanceled(n.zone, s)) mk = 'x';
    else if (n.type === 'rail' && railFull()) mk = 'full';
    else if (n.type === 'blue' && G.month === 2) mk = 'up';
    if (mk) h += `<use href="#mk-${mk}" x="${(n.x + 13).toFixed(1)}" y="${(n.y - 13).toFixed(1)}"/>`;
  }
  g.innerHTML = h;
}

/* ================= トークン（コマ） =================
   コマはキャラクターの「立て札」。地面の点をカメラが画面の座標に計算して重ねる（camera.js の addBillboard） */
function tokenMarkup(i) {
  const d = PLAYER_DEFS[i];
  return `<div class="tk" style="--pc:${d.color};--pcd:${d.dark}"><i class="tk-shadow"></i><i class="tk-pole"></i><i class="tk-base"></i>
    <span class="tk-face">${charSVG(d.char, 42)}</span><span class="tk-bear" hidden>${bombeeImg(54)}</span></div>`;
}
function buildTokens() {
  UI.bb.querySelectorAll('.token').forEach(el => removeBillboard(el));
  TOK.length = 0;
  G.players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'bb token';
    el.dataset.p = i;
    el.innerHTML = tokenMarkup(i);
    const [x, y] = tokenXY(p);
    addBillboard(el, x, y, 6);
    TOK[i] = el;
  });
}
// コマを置く地面の点。同じ場所に何人いても顔が見えるように、手前の列に4人までならべ、
// 5人目からは半分ずらして奥の列に置く（すき間から顔がのぞく）。手番の社長はいつも手前の列
const TOKEN_GAP = 44;
function tokenXY(p, overrideNode) {
  const node = overrideNode ?? p.pos;
  const n = Board.nodes[node];
  let k = 0, cnt = 1;
  if (overrideNode == null) {
    const here = G.players.filter(o => o.pos === node).sort((a, b) => (b.idx === G.turn) - (a.idx === G.turn) || a.idx - b.idx);
    k = here.indexOf(p); cnt = here.length;
  }
  const row = Math.floor(k / 4), col = k % 4, inRow = Math.min(4, cnt - row * 4);
  const dx = (col - (inRow - 1) / 2) * TOKEN_GAP + (row ? TOKEN_GAP / 2 : 0);
  const base = n.kind === 'sq' ? 6 : 22;   // 町とターミナルでは台座の手前に立つ（看板が上に見えるように）
  return [n.x + dx, n.y + base - row * 34];
}
// コマを置く（ms をわたすと、その時間で歩いて動く）
function placeTokens(ms = 180) {
  G.players.forEach(p => {
    const el = TOK[p.idx]; if (!el) return;
    const [x, y] = tokenXY(p), b = el._bb;
    b.zb = p.idx === G.turn ? 9 : 6;   // 手番のコマは同じ深さならいちばん前
    if (Math.abs(b.x - x) > 0.5 || Math.abs(b.y - y) > 0.5) moveBillboard(el, x, y, ms);
    el.classList.toggle('active', p.idx === G.turn && !G.over);
    el.querySelector('.tk-bear').hidden = G.bear !== p.idx;
  });
}
function onSpritesReady() {
  document.querySelectorAll('.hp-bear').forEach(el => { el.innerHTML = bombeeImg(26); });
  if (G && TOK.length && !Picking.active) { buildTokens(); placeTokens(); }
}
async function showBearPop() {
  const el = $('#bearpop');

/* ================= 表示更新 ================= */
function refresh() {
  if (!G) return;
  paintSeasonIfNeeded();
  const ds = G.dest ? stOf(G.dest) : null;
  document.querySelectorAll('.st.dest').forEach(el => el.classList.remove('dest'));
  UI.gMarks.innerHTML = '';
  if (ds) {
    const n = Board.nodes[destNode()];
    n.el.classList.add('dest');
    svgEl('rect', { x: n.x - n.w / 2 - 7, y: n.y - 21, width: n.w + 14, height: 42, rx: 12, class: 'dest-ring' }, UI.gMarks);
  }
  // 町の看板：持ち主の印・独占・目的地の旗（変わったところだけ書きかえる）
  for (const s of STATIONS) {
    const sign = Board.nodes[Board.stNode[s.id]].sign;
    const owners = s.props.map((_, i) => ownerOf(s.id, i));
    const mono = owners.every(o => o === owners[0] && o !== undefined) ? owners[0] : undefined;
    const key = owners.map(o => (o === undefined ? '-' : o)).join('') + (G.dest === s.id ? 'D' : '');
    if (sign.dataset.k === key) continue;
    sign.dataset.k = key;
    sign.classList.toggle('mono', mono !== undefined);
    sign.classList.toggle('dest', G.dest === s.id);
    if (mono !== undefined) sign.style.setProperty('--mc', PLAYER_DEFS[mono].color);
    sign.querySelector('.own').innerHTML = owners.every(o => o === undefined) ? ''
      : mono !== undefined ? '<b class="crown">独占</b>' : owners.map(o => `<i style="${o === undefined ? '' : `background:${PLAYER_DEFS[o].color}`}"></i>`).join('');
    const flag = sign.querySelector('.flag');
    if (G.dest === s.id && !flag) sign.querySelector('.in').insertAdjacentHTML('afterbegin', '<div class="flag"><span>目的地</span></div>');
    else if (G.dest !== s.id && flag) flag.remove();
  }
  placeTokens();
  let over = '';
  if (ds) { const [x, y] = mmXY(...LAYOUT.st[ds.id]); over += `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#e0302f" stroke-width="2.5"><animate attributeName="r" values="4;7;4" dur="1.2s" repeatCount="indefinite"/></circle>`; }
  G.players.forEach(p => { const n = Board.nodes[p.pos]; const [x, y] = mmXY(n.x, n.y); over += `<circle cx="${(x + (p.idx % 4 - 1.5) * 1.6).toFixed(1)}" cy="${(y + (p.idx > 3 ? 1.6 : -1.6)).toFixed(1)}" r="3.4" fill="${def(p).color}" stroke="#fff" stroke-width="1.3"/>`; });
  $('#mm-dyn').innerHTML = over;
  refreshHud();
  const cur = P(G.turn);
  if (cur && ds && !G.over) {
    const d = distToNode(destNode())[cur.pos];
    $('#h-turn').innerHTML = `<b style="color:${def(cur).dark}">${def(cur).name}</b>の番<small>・目的地まであと${d}マス</small>`;
  } else $('#h-turn').textContent = G.over ? 'ゲーム終了' : '';
  Music.update();
}

let msgResolve = null;
function humanContext() {
  if (!G || !P(G.turn)) return false;
  if (isGuest()) return G.turn === Net.mySeat;
  return controller(P(G.turn)) === 'local';
}
function meP() {
  if (!G) return null;
  if (online()) return Net.mySeat >= 0 && P(Net.mySeat) ? P(Net.mySeat) : P(G.turn);
  return humanContext() ? P(G.turn) : (G.players.find(q => q.human) || P(G.turn));
}

function uiSay(who, html, opts = {}) {
  return new Promise(resolve => {
    const box = $('#msg'), face = box.querySelector('.who-face'), tag = box.querySelector('.who');
    if (who === 'bear') { face.innerHTML = bombeeImg(84); tag.textContent = 'ボンビーキョンシー'; tag.style.background = '#3b3a8a'; }
    else if (who && who.idx !== undefined) { face.innerHTML = charSVG(def(who).char, 80); tag.textContent = def(who).name + (seatNick(who.idx) ? `（${seatNick(who.idx)}）` : ''); tag.style.background = def(who).color; }
    else { face.innerHTML = mascotImg(80); tag.textContent = 'パンダのパンパン'; tag.style.background = '#d4141c'; }
    box.querySelector('.txt').innerHTML = html;
    box.hidden = false;
    document.body.classList.add('msg-open');
    box.style.animation = 'none'; void box.offsetHeight; box.style.animation = '';
    let done = false;
    const finish = () => { if (done) return; done = true; box.hidden = true; document.body.classList.remove('msg-open'); msgResolve = null; if (Net.skip === finish) Net.skip = null; resolve(); };
    msgResolve = finish;
    if (isGuest()) Net.skip = finish;
    const auto = online() ? true : (opts.auto ?? !humanContext());
    box.querySelector('.next').hidden = auto;
    if (auto) setTimeout(finish, opts.ms ?? spd(1500));
  });
}
async function say(who, html, opts = {}) {
  await gate();
  const ms = opts.ms ?? spd(online() ? 1900 : 1500);
  netEv({ t: 'say', w: who === 'bear' ? 'b' : who && who.idx !== undefined ? who.idx : 'm', h: html, ms });
  return uiSay(who, html, { ...opts, ms });
}

async function uiBanner(main, sub = '', ms = 1300, cls = '') {

function drawDie(el, v) { el.innerHTML = PIPS[v].map(([x, y]) => `<i class="${v === 1 ? 'one' : ''}" style="left:${x}%;top:${y}%"></i>`).join(''); }
async function showDice(vals, hurry = false) {
  Sound.play('dice');
  const box = $('#dice');
  box.innerHTML = `<div class="row">${'<div class="die rolling"></div>'.repeat(vals.length)}</div>`;
  box.hidden = false;
  const dice = [...box.querySelectorAll('.die')];
  const t0 = performance.now();
  while (performance.now() - t0 < (hurry ? 150 : spd(850))) { dice.forEach(d => drawDie(d, 1 + Math.floor(Math.random() * 6))); await sleep(70); }
  dice.forEach((d, i) => { d.classList.remove('rolling'); d.classList.add('land'); drawDie(d, vals[i]); });
  box.insertAdjacentHTML('beforeend', `<div class="sum">${vals.reduce((a, b) => a + b, 0)}</div>`);
  Sound.play('click');
  await sleep(hurry ? 250 : spd(900));
  box.hidden = true;
}
async function rollDice(n) {
  await gate();
  const vals = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6));
  netEv({ t: 'dice', v: vals });
  await showDice(vals);
  return vals;
}

async function askRemote(p, prompt) {
  const nick = seatNick(p.idx);

  $('#hint').hidden = false;

  $('#hint').hidden = true;

  return a;
}

async function giveCard(p, k) {
  if (p.cards.length >= MAX_CARDS) { await say(p, `「${CARDS[k].name}」が出たけど、カードがいっぱいで持てなかった…`); return; }
  p.cards.push(k); refresh();
  sfx('card'); fxAtPlayer(p, 'カードGET!', '#c08000');
  await say(p, `<b>${CARDS[k].name}</b>を手に入れた！<br><span class="small">${CARDS[k].desc}</span>`);
}

async function useCard(p, key, opt) {
  const i = p.cards.indexOf(key);
  if (i < 0) return 'none';
  p.cards.splice(i, 1); refresh();
  const c = CARDS[key];
  sfx('card');
  await banner(c.name, c.desc, 1000);
  switch (key) {
    case 'kaisoku': case 'tokkai': case 'doche': case 'gaotie':
      await doRoll(p, c.dice); return 'moved';
    case 'pittari': {
      let n = opt;
      if (n == null) {
        const ctrl = controller(p);
        if (ctrl === 'local') n = await chooseNumber();
        else if (ctrl === 'remote') { const a = await askRemote(p, { k: 'num' }); n = a && isInt(a.v, 1, 6) ? a.v : 1 + Math.floor(Math.random() * 6); }
        else n = 1 + Math.floor(Math.random() * 6);
      }
      await say(p, `ぴったり <b>${n}マス</b> 進むよ！`);
      await doRoll(p, 0, n); return 'moved';
    }
    case 'buttobi': {
      const s = pick(STATIONS.filter(x => Board.stNode[x.id] !== p.pos));
      const to = Board.stNode[s.id];
      netEv({ t: 'wp', p: p.idx, to });
      await showWarp(p, to);
      await say(p, `ぶっとんで「<b>${s.n}</b>」に着いた！`);
      await land(p, p.pos); return 'moved';
    }
    case 'hikouki': {
      const opts = Board.special.air.filter(x => x !== p.pos);
      const to = await chooseTravel(p, 'card', opts, 0);
      if (to == null) { p.cards.push(key); refresh(); await say(p, '飛行機カードは使わずにとっておいた。', { ms: spd(900) }); return 'none'; }
      sfx('plane');
      netEv({ t: 'wp', p: p.idx, to });
      await showWarp(p, to);
      await say(p, `ひとっ飛びで「<b>${Board.nodes[to].place}</b>」に着いた！`);
      return 'moved';
    }
    case 'block':
      G.players.forEach(o => { if (o !== p) o.slow = 1; });
      await say(p, 'ほかの社長は次の番、<b>1マス</b>しか進めない！'); return 'util';
    case 'summit':
      G.players.forEach(o => { o.pos = p.pos; }); placeTokens(); refresh();
      await say(p, `全員を「${nodeName(p.pos)}」に呼び集めた！`); return 'util';
    case 'tokusei': {
      const debtors = G.players.filter(o => o.money < 0);
      debtors.forEach(o => { o.money = 0; }); refresh();
      await say(p, debtors.length ? `${debtors.map(o => def(o).name).join('・')}の借金がチャラになった！` : 'だれも借金をしていなかった…'); return 'util';
    }
    case 'geppei': {
      const amt = r100(rint(1000, 3000) * yf());
      addMoney(p, amt);
      await say(p, `月餅が飛ぶように売れて <b>${fmt(amt)}</b> の臨時収入！`); return 'util';
    }
    case 'hongbao': {
      const each = r100(500 * yf());
      let total = 0;
      G.players.forEach(o => { if (o !== p) { o.money -= each; total += each; } });
      addMoney(p, total);
      await say(p, `みんなから紅包（お年玉）を ${fmt(each)} ずつもらった！<br>合計 <b>${fmt(total)}</b>`); return 'util';
    }
    case 'ofuda': {
      if (G.bear !== p.idx) { await say(p, 'ボンビーキョンシーはついていなかった。'); return 'util'; }
      const dist = bfsFrom(p.pos);
      const target = G.players.filter(o => o !== p).sort((a, b) => dist[a.pos] - dist[b.pos])[0];
      G.bear = target.idx; refresh(); sfx('bear');
      await say(p, `お札をペタッ！ ボンビーキョンシーは<b>${def(target).name}</b>のほうへぴょんぴょん逃げていった！`); return 'util';
    }
  }
  return 'util';
}

function renderTravelDialog(p, mode, opts, fee, onPick) {
  const dist = distToNode(destNode());
  const title = { air: '空の旅', port: '船の旅', card: '飛行機カード' }[mode];
  const rows = [...opts].sort((a, b) => dist[a] - dist[b]).map(nd => `<button class="trav" data-nd="${nd}"><b>${esc(Board.nodes[nd].place)}</b><span>目的地まで あと${dist[nd]}マス</span></button>`).join('');
  const dlg = openModal(`<div class="dlg-h">${title}<span class="sub">${fee ? `運賃 ${fmt(fee)}・` : ''}持ち金 ${fmt(p.money)}</span></div>
    <div class="dlg-b"><p class="desc">行き先をえらんでね。（いまの場所から目的地まで あと${dist[p.pos]}マス）</p><div class="trav-list">${rows}</div></div>
    <div class="dlg-f"><button class="btn gray" data-no>${mode === 'card' ? '使わない' : '乗らない'}</button></div>`);
  const lock = () => dlg.querySelectorAll('button').forEach(x => { x.disabled = true; });
  dlg.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => { lock(); onPick(+b.dataset.nd); });
  dlg.querySelector('[data-no]').onclick = () => { lock(); onPick(-1); };
}
async function chooseTravel(p, mode, opts, fee) {
  if (!opts.length) return null;
  const ctrl = controller(p);
  if (ctrl === 'local') {
    const nd = await new Promise(resolve => renderTravelDialog(p, mode, opts, fee, v => { closeModal(); resolve(v); }));
    return nd >= 0 ? nd : null;
  }
  if (ctrl === 'remote') {
    const a = await askRemote(p, { k: 'trav', m: mode, o: opts, fee });
    if (a) return isInt(a.nd, 0, Board.nodes.length - 1) && opts.includes(a.nd) ? a.nd : null;
  }
  // CPU：目的地にぐっと近づけるときだけ乗る
  const dist = distToNode(destNode());
  const best = [...opts].sort((a, b) => dist[a] - dist[b])[0];
  const reserve = fee ? 3000 * yf() : 0;
  return dist[best] + 10 <= dist[p.pos] && p.money - fee >= reserve ? best : null;
}
